<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="جسر: تعلّم العبري من العربي اللي بتعرفه. دروس تفاعلية من أول حرف لحد العبري المهني.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>جسر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Gveret+Levin&family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Reem+Kufi:wght@600;700&display=swap">
<style>
/* Layout: one-column lesson stepper — progress on top, one card per step, action bar pinned at the bottom */
:root{
  /* palette: violet learning — vivid violet on soft lavender, orange for rewards */
  --bg:#F6F4FD; --surface:#FFFFFF; --sunk:#EFECFA; --line:#E4DFF5;
  --fg:#16132B; --muted:#6B6880; --accent:#6C3CE1; --accent-soft:#EEE8FD;
  --good:#1F8A55; --good-soft:#E2F5EA; --bad:#D6455D; --bad-soft:#FCE7EB; --gold:#C46F00; --brass:#F7A325; --hand:#C2417A; --hero:#6C3CE1; --on-hero:#FFFFFF;
  --shadow:0 1px 2px rgba(40,22,110,.05),0 8px 24px rgba(40,22,110,.06);
  --f-display:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-he:"Frank Ruhl Libre","Noto Serif Hebrew","Times New Roman",serif;
  --f-hand:"Gveret Levin","Frank Ruhl Libre",cursive;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#110F1F; --surface:#1B1830; --sunk:#25213F; --line:#332D52;
  --fg:#EEEBFA; --muted:#A7A2C2; --accent:#A98BFF; --accent-soft:#2A2352;
  --good:#6FD39C; --good-soft:#163323; --bad:#FF8DA0; --bad-soft:#3A1C25; --gold:#FBBF5A; --brass:#FBBF5A; --hand:#F29AC2; --hero:#5B34C9; --on-hero:#FFFFFF;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#110F1F; --surface:#1B1830; --sunk:#25213F; --line:#332D52;
  --fg:#EEEBFA; --muted:#A7A2C2; --accent:#A98BFF; --accent-soft:#2A2352;
  --good:#6FD39C; --good-soft:#163323; --bad:#FF8DA0; --bad-soft:#3A1C25; --gold:#FBBF5A; --brass:#FBBF5A; --hand:#F29AC2; --hero:#5B34C9; --on-hero:#FFFFFF;
  --shadow:none; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.7}
#app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:12px 120px;display:flex;flex-direction:column;gap:16px}
.he{font-family:var(--f-he);font-weight:500;direction:rtl;unicode-bidi:isolate}
.hand{font-family:var(--f-hand);font-weight:400;color:var(--hand);direction:rtl;unicode-bidi:isolate}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;flex-direction:column;gap:8px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.eyebrow{font-size:12.5px;color:var(--muted);letter-spacing:.02em}
.xp{font-variant-numeric:tabular-nums;font-weight:700;color:var(--gold);font-size:14px;white-space:nowrap}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--brass);border-radius:99px;transition:width .4s ease}

h1,h2{font-family:var(--f-display);font-weight:700;line-height:1.3;text-wrap:balance;margin:0}
h1{font-size:28px}
h2{font-size:22px}
p{margin:0}
.lead{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.note{background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;font-size:15px}
.note b{color:var(--accent)}
.part{display:inline-flex;align-self:flex-start;gap:6px;align-items:center;font-size:13px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:99px;padding:3px 12px}

.glyph{font-family:var(--f-he);font-weight:700;line-height:1;color:var(--fg)}
.hero{display:flex;align-items:center;justify-content:center;gap:20px;padding-block:20px}
.hero .glyph{font-size:84px}
.hero .eq{font-size:28px;color:var(--muted)}
.hero .ar{font-family:var(--f-display);font-size:64px;color:var(--accent)}

/* alphabet table */
.abc{display:flex;flex-direction:column}
.abc-head,.abc-row{display:grid;grid-template-columns:52px 52px 1fr 76px 40px;align-items:center;gap:8px;padding:6px 4px}
.abc-head{font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
.abc-row{border-bottom:1px solid var(--line);background:none;border-inline:0;border-top:0;text-align:start;width:100%}
.abc-row:last-child{border-bottom:0}
.abc-row .glyph{font-size:34px;text-align:center}
.abc-row .hand{font-size:38px;text-align:center;line-height:1}
.abc-row .nm{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.abc-row .nm small{color:var(--muted);font-size:12.5px}
.abc-row .snd{font-family:var(--f-display);font-size:19px;color:var(--accent);text-align:center}
.abc-row .play{color:var(--muted);display:flex;justify-content:center}
.abc-row .play svg{width:20px;height:20px}
.abc-sub{font-family:var(--f-display);font-size:15px;color:var(--muted);padding:14px 4px 4px}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend span b{font-weight:700}

/* letters grid */
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.grid.g4{grid-template-columns:repeat(4,1fr)}
.tile{aspect-ratio:1;max-width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:4px;position:relative}
.tile .glyph{font-size:32px}
.tile .hand{font-size:22px;line-height:1.1}
.tile small{font-size:11.5px;color:var(--muted)}
.tile.seen{border-color:var(--accent);background:var(--accent-soft)}
.tile.seen::after{content:"✓";position:absolute;top:3px;left:6px;font-size:11px;color:var(--accent);font-weight:700}
.counter{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}

.sheet-wrap{position:fixed;inset:0;background:rgba(10,12,24,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:90%;overflow:auto}
.forms{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form{background:var(--sunk);border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px}
.form .glyph{font-size:64px}
.form .hand{font-size:64px;line-height:1.05}
.form small{font-size:12.5px;color:var(--muted)}
.sheet-title{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sheet-title strong{font-family:var(--f-display);font-size:22px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:15px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.ex{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--sunk);border-radius:12px;padding:10px 14px}
.ex .he{font-size:30px}

.btn{border:0;border-radius:12px;padding:14px 18px;font-weight:700;background:var(--accent);color:var(--surface);min-height:52px}
.btn[disabled]{opacity:.38;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.speak{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-size:14px;font-weight:500}
.speak svg{width:18px;height:18px}

.q{display:flex;flex-direction:column;gap:14px}
.q-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.q-prompt{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;padding-block:8px}
.q-prompt .glyph{font-size:88px}
.q-prompt .hand{font-size:92px;line-height:1.05}
.q-prompt .word{font-family:var(--f-he);font-size:56px;font-weight:700;line-height:1.2}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 10px;min-height:64px;font-size:20px;font-weight:500}
.opt .he{font-size:30px}
.opt.ar-letter{font-family:var(--f-display);font-size:26px}
.opt.right{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.opt[disabled]{cursor:default}
.feedback{border-radius:12px;padding:12px 14px;font-size:15px}
.feedback.good{background:var(--good-soft);color:var(--good)}
.feedback.bad{background:var(--bad-soft);color:var(--bad)}
.score{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;padding-block:12px}
.score .big{font-family:var(--f-display);font-size:48px;color:var(--accent);font-variant-numeric:tabular-nums}

.pairs{display:flex;flex-direction:column;gap:10px}
.pair{display:grid;grid-template-columns:auto auto 1fr;align-items:center;gap:14px}
.pair .glyph{font-size:52px;min-width:44px;text-align:center}
.pair p{font-size:14.5px;color:var(--muted)}

.root-letters{display:flex;justify-content:center;gap:10px;direction:rtl}
.root-letters span{font-family:var(--f-he);font-size:44px;font-weight:700;width:68px;height:68px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.row .he{font-size:28px}
.row small{display:block;color:var(--muted);font-size:13.5px}

.finals{display:flex;flex-direction:column;gap:8px}
.final{display:grid;grid-template-columns:1fr auto 1fr auto;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.final .glyph{font-size:44px;text-align:center}
.final .arrow{color:var(--muted);font-size:14px;text-align:center}
.final .hand{font-size:44px;text-align:center;line-height:1}

.slots{display:flex;justify-content:center;gap:8px;direction:rtl;min-height:72px;flex-wrap:wrap}
.slot{width:56px;height:64px;border-bottom:3px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--f-he);font-size:40px;font-weight:700}
.slot.filled{border-color:var(--accent)}
.slots.ok .slot{border-color:var(--good);color:var(--good)}
.slots.no .slot{border-color:var(--bad);color:var(--bad)}
.tiles{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;direction:rtl}
.ltile{width:58px;height:58px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-family:var(--f-he);font-size:34px;font-weight:700}
.ltile[disabled]{opacity:.25}
.target{text-align:center;font-family:var(--f-display);font-size:30px;color:var(--accent)}

.menu{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.menu-title{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px dashed var(--line);padding-bottom:8px}
.menu-title .he{font-size:26px;font-weight:700}
.menu-item{display:flex;justify-content:space-between;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--surface);width:100%}
.menu-item .he{font-size:30px}
.menu-item .price{font-variant-numeric:tabular-nums;color:var(--muted);font-size:15px;direction:ltr}
.menu-item.right{border-color:var(--good);background:var(--good-soft)}
.menu-item.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ff{border:2px dashed var(--gold);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px}
.ff b{color:var(--gold)}

.badge{width:132px;height:132px;border-radius:50%;margin:8px auto;background:var(--accent-soft);border:3px solid var(--accent);display:flex;align-items:center;justify-content:center;flex-direction:column}
.badge .glyph{font-size:40px;color:var(--accent)}
.badge small{font-size:12px;color:var(--accent);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 4px}
.stats b{display:block;font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
.stats span{font-size:12.5px;color:var(--muted)}
.next-unit{display:flex;justify-content:space-between;align-items:center;gap:12px}

.bottom{position:fixed;bottom:0;inset-inline:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));z-index:10}
.bottom-in{max-width:528px;margin:0 auto;display:flex;gap:10px}
.bottom-in .btn{flex:1}
.bottom-in .ghost{flex:0 0 auto;padding-inline:16px}

.toast{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));inset-inline:16px;max-width:528px;margin:0 auto;background:var(--fg);color:var(--bg);border-radius:12px;padding:12px 14px;font-size:14.5px;z-index:30}
@keyframes pop{from{transform:scale(.96);opacity:.6}to{transform:none;opacity:1}}
.pop{animation:pop .22s ease-out}
@media (prefers-reduced-motion:reduce){.pop{animation:none}.bar>i{transition:none}}
@media (max-width:380px){.abc-head,.abc-row{grid-template-columns:44px 44px 1fr 64px 32px;gap:6px}.grid{grid-template-columns:repeat(4,1fr)}}

/* ---------- platform shell ---------- */
.shell{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:8px 104px;display:flex;flex-direction:column;gap:16px}
.view{display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px 0}
.logo{display:flex;align-items:baseline;gap:8px}
.logo b{font-family:var(--f-display);font-size:30px;color:var(--accent);line-height:1}
.logo span{font-family:var(--f-he);font-size:24px;font-weight:700;color:var(--muted);line-height:1}
.chips{display:flex;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 12px}
.chip.fire{color:var(--gold)}
.chip.star{color:var(--accent)}
.hello h1{font-size:26px}
.continue{background:var(--hero);color:var(--on-hero);border-radius:22px;box-shadow:0 10px 28px rgba(108,60,225,.28);padding:18px;display:flex;flex-direction:column;gap:12px;border:0;text-align:start;width:100%}
.continue .eyebrow{color:inherit;opacity:.8}
.continue h2{font-size:22px;color:inherit}
.continue .prog{height:8px;border-radius:99px;background:rgba(255,255,255,.28);overflow:hidden}
.continue .prog i{display:block;height:100%;background:#FFFFFF;border-radius:99px}
.continue .go{align-self:flex-start;background:var(--on-hero);color:var(--hero);font-weight:700;border-radius:10px;padding:8px 16px}
.cards2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0;box-shadow:var(--shadow)}
.mini .eyebrow{font-size:12px}
.ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--brass) calc(var(--p)*1%),var(--sunk) 0);display:flex;align-items:center;justify-content:center}
.ring span{width:50px;height:50px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.wod{display:flex;align-items:center;justify-content:space-between;gap:12px}
.wod .he{font-size:40px;font-weight:700;line-height:1.1}
.wod-pair{display:flex;align-items:center;gap:10px;font-size:15px}
.wod-card{display:flex;flex-direction:column;gap:12px}
.wod-top{display:flex;justify-content:space-between;align-items:center}
.wod-main{display:flex;align-items:center;justify-content:space-between;gap:12px}
.wod-word{font-size:44px;font-weight:700;line-height:1.1}
.root-chip{align-self:flex-start;font-size:13px;font-weight:700;color:var(--gold);background:var(--sunk);border-radius:99px;padding:3px 12px}
.wod-ex{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--sunk);border-radius:12px;padding:10px 14px}
.wod-ex .he{font-size:20px}
.wod-ex .lead{font-size:14px}
.speak.icon{padding:8px;flex:0 0 auto}
.save-word{min-height:46px}
.saved-list{display:flex;flex-direction:column}
.saved-row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.saved-row:last-child{border-bottom:0}
.saved-row .he{font-size:22px}
.unsave{border:0;background:none;color:var(--muted);font-size:16px;padding:4px 8px}
.nq{line-height:1.6}
.q-prompt .word.nq{font-size:60px;line-height:1.5}
.q-prompt .glyph.nq{font-size:80px;line-height:1.4}
.vlist{display:flex;flex-direction:column;gap:12px}
.vcard{display:flex;flex-direction:column;gap:10px}
.vhead{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.vhead small{display:block;color:var(--muted);font-size:13px}
.vlat{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px;font-family:var(--f-body)}
.vmarks{display:flex;gap:10px;flex-wrap:wrap}
.vm{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--sunk);border-radius:12px;padding:8px 16px}
.vm .glyph{font-size:48px}
.vm small{font-size:13px;color:var(--muted)}
.vnote{font-size:15px}
.cmp{display:flex;flex-direction:column}
.cmp-row{display:grid;grid-template-columns:56px 1fr 1fr;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.cmp-row:last-child{border-bottom:0}
.cmp-row.head{font-size:12.5px;color:var(--muted)}
.cmp-row .glyph{font-size:30px}
.sp{display:flex;flex-direction:column;gap:10px}
.sp-head{display:flex;align-items:center;gap:14px}
.sp-head .glyph{font-size:48px}
.sign{background:#1E5A3C;color:#FFFFFF;border:4px solid #FFFFFF;outline:2px solid #1E5A3C;border-radius:10px;padding:18px;text-align:center}
.sign .he{font-size:40px;font-weight:700;color:#FFFFFF}
.opts.one{grid-template-columns:1fr}
.hl{color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:0 2px}
.bubble{align-self:center;background:#DCF8C6;color:#111B21;border-radius:14px 14px 4px 14px;padding:12px 16px;font-family:var(--f-he);font-size:30px;font-weight:500;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.signs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.msign{border:2px solid #1C2B4A;background:#1C2B4A;color:#FFFFFF;border-radius:10px;padding:16px 8px;min-height:72px}
.msign .he{font-size:30px;font-weight:700;color:#FFFFFF}
.msign.right{background:var(--good);border-color:var(--good)}
.msign.wrong{background:var(--bad);border-color:var(--bad)}
.msign[disabled]{cursor:default}
.chip.admin{color:var(--surface);background:var(--accent);border-color:var(--accent)}
.admin-form{display:flex;gap:8px;align-items:center}
.admin-form input{width:110px;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:0 10px;font:inherit;background:var(--surface);color:var(--fg)}
.trace-pick{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;direction:rtl}
.tp{flex:0 0 auto;width:44px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-family:var(--f-he);font-size:24px;font-weight:700}
.tp.seen{background:var(--accent-soft);border-color:var(--accent-soft)}
.tp.on{border-color:var(--accent);color:var(--accent)}
.trace-box{padding:8px}
.trace-box canvas{display:block;width:100%;max-width:100%;aspect-ratio:1;border-radius:12px;touch-action:none;cursor:crosshair}
.trace-actions{display:flex;gap:10px}
.trace-actions .btn{flex:1}
.typed,.sent{min-height:60px;border-bottom:3px solid var(--line);font-family:var(--f-he);font-size:34px;font-weight:700;text-align:center;padding:6px;word-break:break-all}
.typed.ok,.sent.ok{border-color:var(--good);color:var(--good)}
.typed.no,.sent.no{border-color:var(--bad);color:var(--bad)}
.kb{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.kb-row{display:flex;gap:4px;justify-content:center}
.key{flex:1 1 0;min-width:0;max-width:48px;height:48px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;box-shadow:0 1px 0 var(--line)}
.key .he{font-size:20px;font-weight:700;line-height:1}
.key small{font-size:9.5px;color:var(--muted);line-height:1;margin-top:2px}
.key.wide{max-width:none;flex:2 1 0;font-size:13px}
.key:active{background:var(--accent-soft)}
.wtiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.wtile{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-family:var(--f-he);font-size:24px;font-weight:700}
.wtile[disabled]{opacity:.3}
.chat{display:flex;flex-direction:column;gap:8px;background:var(--sunk);border-radius:var(--r);padding:12px}
.msg{max-width:85%;border-radius:14px;padding:8px 12px;display:flex;flex-direction:column;gap:2px}
.msg b{font-size:12px;color:var(--accent)}
.msg .he{font-size:20px}
.msg small{font-size:13px;color:var(--muted)}
.msg.them{align-self:flex-start;background:var(--surface);border:1px solid var(--line)}
.msg.me{align-self:flex-end;background:var(--accent);color:#FFFFFF}
.msg.me .he{color:#FFFFFF}
.fc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fc{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-height:96px;display:flex}
.fc-face{flex:1;border:0;background:none;padding:14px 10px 38px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center}
.fc-face .he{font-size:24px;font-weight:700;line-height:1.3}
.fc-back{display:none;flex-direction:column;align-items:center;gap:2px}
.fc-back b{font-size:15px;color:var(--accent)}
.fc-back small{font-size:12.5px;color:var(--muted)}
.fc.on{border-color:var(--accent);background:var(--accent-soft)}
.fc.on .fc-back{display:flex}
.fc .speak{position:absolute;bottom:6px;inset-inline-start:6px;padding:4px 8px;border-radius:99px}
.fc .speak svg{width:15px;height:15px}
.dsearch input{width:100%;min-height:50px;border:1.5px solid var(--line);border-radius:14px;padding:0 16px;font:inherit;font-size:17px;background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.dsearch input:focus{outline:none;border-color:var(--accent)}
.dchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.dchip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13.5px;white-space:nowrap}
.dchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#FFFFFF;font-weight:700}
.dlist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.dentry{display:grid;grid-template-columns:1fr auto;border-bottom:1px solid var(--line)}
.dentry:last-child{border-bottom:0}
.dentry.open{background:var(--accent-soft)}
.dmain{border:0;background:none;display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:12px 14px;text-align:start;min-width:0}
.dmain .he{font-size:22px;font-weight:700;flex:0 0 auto}
.dmean{color:var(--muted);font-size:14.5px;text-align:end;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dsay{border:0;background:none;color:var(--muted);padding:0 14px;display:flex;align-items:center}
.dsay svg{width:20px;height:20px}
.dmore{grid-column:1/-1;padding:0 14px 14px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.tab{font-size:11.5px}
.section-title{font-family:var(--f-display);font-size:18px;margin:0}

/* path */
.level{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.level-head{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:14px;width:100%;background:none;border:0;text-align:start}
.lv-num{width:48px;height:48px;border-radius:12px;background:var(--sunk);display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:22px;color:var(--muted)}
.level.open .lv-num,.level.active .lv-num{background:var(--accent-soft);color:var(--accent)}
.lv-meta{display:flex;flex-direction:column;min-width:0;line-height:1.4}
.lv-meta b{font-size:16px}
.lv-meta small{color:var(--muted);font-size:13px}
.cefr{font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 8px;white-space:nowrap}
.units{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.unit{display:grid;grid-template-columns:32px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:start;width:100%}
.unit:last-child{border-bottom:0}
.unit .dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;background:var(--sunk);color:var(--muted)}
.unit.done .dot{background:var(--good);color:var(--surface)}
.unit.current .dot{background:var(--accent);color:var(--surface)}
.unit .u-name{min-width:0;line-height:1.4}
.unit .u-name small{display:block;color:var(--muted);font-size:12.5px}
.unit .state{font-size:12.5px;color:var(--muted);white-space:nowrap}
.unit.current .state{color:var(--accent);font-weight:700}
.unit.done .state{color:var(--good);font-weight:700}
.unit.locked{cursor:default}
.unit.locked .u-name{color:var(--muted)}
.placement{display:flex;align-items:center;justify-content:space-between;gap:12px}

/* tracks */
.track{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;box-shadow:var(--shadow)}
.track .ic{width:52px;height:52px;border-radius:14px;background:var(--sunk);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.track .ic svg{width:26px;height:26px}
.track.first{border-color:var(--accent)}
.track.first .ic{background:var(--accent-soft);color:var(--accent)}
.track b{display:block}
.track small{color:var(--muted);font-size:13.5px;line-height:1.5;display:block}
.tag{font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.tag.soon{background:var(--accent-soft);color:var(--accent)}

/* me */
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow)}
.stat b{font-family:var(--f-display);font-size:28px;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:13px;color:var(--muted)}
.setting{display:flex;align-items:center;justify-content:space-between;gap:12px}
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:8px;padding:6px 12px;font-size:14px;font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);font-weight:700}
.letters-learned{display:flex;flex-wrap:wrap;gap:6px;direction:rtl}
.letters-learned span{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--f-he);font-size:22px;font-weight:700;background:var(--sunk);color:var(--muted)}
.letters-learned span.on{background:var(--accent-soft);color:var(--accent)}

/* tabs */
.tabs{position:fixed;bottom:0;inset-inline:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;font-size:12px;color:var(--muted);border-radius:10px}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent);font-weight:700}

/* lesson overlay */
#lessonView{position:fixed;inset:0;background:var(--bg);z-index:15;overflow:auto;padding-top:env(safe-area-inset-top,0px)}
.lesson-close{border:0;background:var(--surface);border:1px solid var(--line);width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;line-height:1;color:var(--muted);flex:0 0 auto}
.top-row .left{display:flex;align-items:center;gap:10px}


/* reading */
.rd-top{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.rd-title .he{font-size:26px;display:block;line-height:1.3}.rd-title small{color:var(--muted);font-size:13px}
.rd-lv{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.rd-item{display:grid;grid-template-columns:1fr auto;grid-template-areas:"he st" "meta st";gap:2px 10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:start;box-shadow:var(--shadow);color:var(--fg)}
.rd-item .he{grid-area:he;font-size:19px}.rd-meta{grid-area:meta;display:flex;flex-direction:column}.rd-meta b{font-size:14px;font-weight:500}.rd-meta small{color:var(--muted);font-size:12.5px}
.rd-state{grid-area:st;font-size:13px;font-weight:700;color:var(--accent)}.rd-state i{font-style:normal;color:var(--good)}
.rd-item.locked{opacity:.55}.rd-item.locked .rd-state{color:var(--muted)}
.rd-wrap{display:flex;flex-direction:column;gap:14px;padding-bottom:20px}
.rd-tools{display:flex;gap:8px;flex-wrap:wrap}.rd-tools .dchip{display:inline-flex;align-items:center;gap:6px}.rd-tools svg{width:16px;height:16px}
.rd-seg{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);font-family:var(--f-he);font-size:22px;line-height:1.9}
.rd-seg p{margin:0 0 4px}.rd-who{color:var(--accent);font-weight:700}
.rd-seg.doc{border:2px solid var(--fg);border-radius:10px;text-align:center;font-weight:700;background:var(--sunk)}
.rd-seg.hand{font-family:"Gveret Levin","Frank Ruhl Libre",cursive;background:#FFF9D9;color:#2B2A55;border-color:#EEDC8A;transform:rotate(-.4deg)}
:root[data-theme="dark"] .rd-seg.hand{background:#3A3420;color:#F3EBC7;border-color:#5C5230}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .rd-seg.hand{background:#3A3420;color:#F3EBC7;border-color:#5C5230}}
.rw{cursor:pointer;border-radius:4px;transition:background .15s}.rw:hover,.rw:active{background:var(--accent-soft)}
.rd-segbar{display:flex;gap:8px;align-items:center;margin-top:8px;font-family:var(--f-body);font-size:14px;font-weight:400}
.rd-trbtn{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-size:13.5px;color:var(--fg)}
.rd-ar{font-family:var(--f-body);font-size:15px;line-height:1.8;color:var(--muted);border-top:1px dashed var(--line);margin-top:10px;padding-top:10px;font-weight:400;text-align:start}
.rd-q{display:flex;flex-direction:column;gap:10px}.rd-opts{display:grid;gap:8px}
.rd-opts .tr-opt{min-height:52px;font-size:15px}.rd-opts .tr-opt[lang="he"]{font-family:var(--f-he);font-size:18px}
.rd-final{display:flex;flex-direction:column;gap:10px}
.rd-tf{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:10px}.rd-tf>span[lang="he"]{font-family:var(--f-he);font-size:18px}
.rd-tf div{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rd-tfb,.rd-ord,.rd-sent{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;color:var(--fg);font-size:15px;text-align:start}
.rd-tfb{text-align:center;font-weight:700}
.rd-ord{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center}.rd-ord .n{width:28px;height:28px;border-radius:50%;background:var(--sunk);display:flex;align-items:center;justify-content:center;font-weight:700}
.rd-ord span[lang="he"]{font-family:var(--f-he);font-size:17px}
.rd-find{display:flex;flex-direction:column;gap:6px}.rd-sent{font-family:var(--f-he);font-size:18px;line-height:1.6}
.rd-tfb.ok,.rd-ord.ok,.rd-sent.ok{border-color:var(--good);background:var(--good-soft)}.rd-tfb.bad,.rd-ord.bad,.rd-sent.bad{border-color:var(--bad);background:var(--bad-soft)}
.rd-tfb[disabled],.rd-ord[disabled],.rd-sent[disabled]{cursor:default}
.rd-words{display:flex;flex-direction:column;gap:4px}
.rd-w{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;border-top:1px solid var(--line);padding:8px 0}.rd-w .he{font-size:20px}.rd-w small{color:var(--muted)}
.rd-sv{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--accent);background:none;color:var(--accent);font-weight:700}.rd-sv.on{background:var(--accent);color:var(--on-hero)}
.rd-sheet{position:fixed;inset-inline:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));max-width:536px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:0 18px 48px rgba(22,19,43,.28);padding:18px;z-index:30;display:flex;flex-direction:column;gap:6px}
.rd-sheet>.he{font-size:30px}.rd-mean{font-size:20px}.rd-sheet small{color:var(--muted)}
.rd-close{position:absolute;top:12px;inset-inline-end:12px;border:0;background:var(--sunk);color:var(--muted);width:34px;height:34px;border-radius:50%}

/* packs */
.pk-name{grid-area:he;font-weight:700;font-size:16px}
.pk-bar{display:block;height:5px;border-radius:99px;background:var(--sunk);overflow:hidden;margin-top:4px;width:140px}.pk-bar i{display:block;height:100%;background:var(--good)}
.pk-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pk-card{min-height:84px;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--fg);box-shadow:var(--shadow)}
.pk-card .he{font-size:22px;line-height:1.3}.pk-card b{font-size:15px;font-weight:700;line-height:1.4}.pk-card small{color:var(--muted);font-size:12.5px}
.pk-card.on{background:var(--accent-soft);border-color:var(--accent)}
/* training */
.tr-home{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;text-align:start;width:100%;color:var(--fg)}.tr-home .ic{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}.tr-home .ic svg{width:22px;height:22px}.tr-home b{display:block}.tr-home small{color:var(--muted);font-size:13px}.tr-home .go{background:var(--accent);color:var(--on-hero);font-weight:700;border-radius:10px;padding:6px 14px;font-size:14px}
.tr-today{background:var(--hero);color:var(--on-hero);border-radius:22px;box-shadow:0 10px 28px rgba(108,60,225,.28);padding:18px;display:flex;flex-direction:column;gap:10px;border:0;text-align:start;width:100%}
.tr-today .eyebrow{color:inherit;opacity:.8}.tr-today h2{font-size:22px;color:inherit}
.tr-stats{display:flex;gap:16px;font-size:13.5px;opacity:.92}.tr-stats b{font-size:17px;font-variant-numeric:tabular-nums}
.tr-today .go{align-self:flex-start;background:var(--on-hero);color:var(--hero);font-weight:700;border-radius:10px;padding:8px 16px}
.tr-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tr-mode{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:start;box-shadow:var(--shadow);min-width:0}
.tr-mode .ic{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.tr-mode .ic svg{width:22px;height:22px}.tr-mode b{font-size:15.5px}.tr-mode small{color:var(--muted);font-size:12.5px;line-height:1.45}
.tr-wrap{display:flex;flex-direction:column;gap:14px}
.tr-head{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.tr-x{border:0;background:var(--sunk);color:var(--muted);width:40px;height:40px;border-radius:50%;font-size:16px}
.tr-head .prog{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}.tr-head .prog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.tr-ask{font-weight:700;font-size:17px}
.tr-word{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 16px;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;box-shadow:var(--shadow);min-height:110px}
.tr-word .he{font-size:40px;line-height:1.2}.tr-ar{font-size:24px}
.tr-root{flex-direction:column;gap:6px}.tr-root small{color:var(--muted);font-size:14px;text-align:center}
.tr-big{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:var(--accent);color:var(--on-hero);border-radius:50%;width:96px;height:96px;justify-content:center;font-weight:700;font-size:13px}
.tr-big svg{width:34px;height:34px}
.tr-reveal{text-align:center;font-size:28px}.tr-reveal small{font-family:var(--f-body,inherit);font-size:15px;color:var(--muted)}
.tr-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tr-opt{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 10px;min-height:64px;font-size:16px;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--fg)}
.tr-opt .he{font-size:24px}.tr-opt small{color:var(--muted);font-size:12.5px}
.tr-opt.ok{border-color:var(--good);background:var(--good-soft)}.tr-opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.tr-opt[disabled]{cursor:default}.tr-opt[disabled]:not(.ok):not(.bad){opacity:.55}
.tr-slot{min-height:64px;border:2px dashed var(--line);border-radius:14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;padding:10px;font-family:var(--f-he);font-size:30px}
.tr-slot.sent{font-size:22px}.tr-slot em{font-family:inherit;font-style:normal;font-size:14px;color:var(--muted)}
.tr-slot.ok{border-style:solid;border-color:var(--good);background:var(--good-soft)}.tr-slot.bad{border-style:solid;border-color:var(--bad);background:var(--bad-soft)}
.tr-tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tr-tile{min-width:52px;height:52px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;font-family:var(--f-he);font-size:26px;color:var(--fg);box-shadow:var(--shadow);padding:0 10px}
.tr-tiles.sent .tr-tile{font-size:20px}.tr-tile[disabled]{opacity:.25;box-shadow:none}
.tr-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tr-fb{border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.tr-fb.ok{background:var(--good-soft)}.tr-fb.ok>b{color:var(--good)}.tr-fb.bad{background:var(--bad-soft)}.tr-fb.bad>b{color:var(--bad)}
.tr-ans{display:flex;align-items:center;gap:10px}.tr-ans .he{font-size:24px}.tr-fb small{color:var(--muted);font-size:14px}

let heVoice=null,warned=false;
function loadVoices(){try{const v=window.speechSynthesis?speechSynthesis.getVoices():[];heVoice=v.find(x=>/^(he|iw)/i.test(x.lang))||null;}catch(e){}}
if(window.speechSynthesis){loadVoices();try{speechSynthesis.addEventListener("voiceschanged",loadVoices);}catch(e){}}
function speak(t){
  if(!window.speechSynthesis){toast("جهازك ما بيدعم الصوت هون. بالنسخة النهائية رح يكون في تسجيلات صوتية.");return;}
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="he-IL";u.rate=.8;if(heVoice)u.voice=heVoice;speechSynthesis.speak(u);
    if(!heVoice&&!warned)setTimeout(()=>{loadVoices();if(!heVoice){warned=true;toast("ما لقيت صوت عبري على جهازك، فممكن اللفظ يطلع غلط. استعين باللفظ المكتوب.");}},400);
  }catch(e){toast("ما زبط تشغيل الصوت.");}
}

/* ---------- quiz engine ---------- */
function quiz(host,qs,onEnd){
  let i=0,right=0;
  function render(){
    const q=qs[i];
    host.innerHTML=`<div class="q panel pop">
      <div class="q-meta"><span>سؤال ${i+1} من ${qs.length}</span><span>${right} صح</span></div>
      <div class="q-prompt">${q.prompt}</div>
      <div class="opts">${q.opts.map((o,k)=>`<button type="button" class="opt ${q.optClass||""}" data-k="${k}">${o}</button>`).join("")}</div>
      <div class="fb"></div></div>`;
    if(q.auto)setTimeout(()=>speak(q.auto),250);
    host.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>answer(+b.dataset.k)));
  }
  function answer(k){
    const q=qs[i],ok=k===q.ans;
    host.querySelectorAll(".opt").forEach((b,n)=>{b.disabled=true;if(n===q.ans)b.classList.add("right");else if(n===k)b.classList.add("wrong");});
    if(ok){right++;addXP(10);}
    const fb=host.querySelector(".fb");
    fb.innerHTML=`<div class="feedback ${ok?"good":"bad"}">${ok?"صح! ":"مش هاي. "}${q.explain||""}</div>
      <button type="button" class="btn qn" style="width:100%;margin-top:10px">${i+1<qs.length?"السؤال الجاي":"شوف النتيجة"}</button>`;
    const qn=host.querySelector(".qn");qn.addEventListener("click",()=>{i++;if(i<qs.length)render();else end();});qn.focus();
  }
  function end(){
    host.innerHTML=`<div class="panel score pop"><span class="lead">نتيجتك</span><span class="big">${right}/${qs.length}</span>
      <p>${right===qs.length?"ممتاز، ولا غلطة!":right>=qs.length*.7?"شغل منيح. كمّل.":"منيح كبداية. ممكن تعيده إذا بدك."}</p>
      <button type="button" class="btn ghost again">أعيد</button></div>`;
    host.querySelector(".again").addEventListener("click",()=>onEnd(right,true));
    onEnd(right,false);
  }
  render();
}

function letterQ(l,pool){const o=shuffle([l.ar,...pick([...new Set(pool.map(x=>x.ar))],3,x=>x===l.ar)]);
  const useHand=Math.random()<.35;
  return{prompt:`${useHand?`<span class="hand" lang="he">${l.h}</span><p class="lead">هاد الحرف بخط اليد. شو صوته؟</p>`:`<span class="glyph" lang="he">${l.h}</span><p class="lead">شو صوت هالحرف؟</p>`}`,opts:o,ans:o.indexOf(l.ar),optClass:"ar-letter",explain:`${he(l.h)} اسمه «${l.name}» وصوته ${l.ar}.`};}
function finalQ(f){const o=shuffle(FINALS.map(x=>x.base));return{prompt:`<span class="glyph" lang="he">${f.h}</span><p class="lead">هاد حرف نهائي. هو شكل أي حرف؟</p>`,opts:o.map(he),ans:o.indexOf(f.base),explain:`${he(f.h)} هو ${he(f.base)} لما ييجي بآخر الكلمة.`};}

function quizScreen(key,head,title,lead,build,minPass){
  screen.innerHTML=`<div class="stack pop">${head||""}<h2>${title}</h2><p class="lead">${lead}</p><div class="qhost"></div></div>`;
  const host=screen.querySelector(".qhost");
  const start=()=>quiz(host,build(),(score,restart)=>{if(restart){start();return;}S.done[key]=Math.max(S.done[key]||0,score);if(key==="check")S.best=Math.max(S.best,score);save();refreshNav(minPass?score>=minPass:true);if(minPass&&score>=minPass)setTimeout(()=>go(S.step+1),900);});
  start();
  return key==="check"?S.best>=minPass:S.done[key]!==undefined;
}

const KB=[["/","'","ק","ר","א","ט","ו","ן","ם","פ"],["ש","ד","ג","כ","ע","י","ח","ל","ך","ף"],["ז","ס","ב","ה","נ","מ","צ","ת","ץ"]];
const KBLAT=[["Q","W","E","R","T","Y","U","I","O","P"],["A","S","D","F","G","H","J","K","L",";"],["Z","X","C","V","B","N","M",",","."]];
const TYPE=[{ar:"شالوم · سلام",w:"שלום"},{ar:"تودا · شكرًا",w:"תודה"},{ar:"يِلِد · ولد",w:"ילד"},{ar:"بايِت · بيت",w:"בית"},{ar:"مايِم · مي",w:"מים"},{ar:"عير · مدينة",w:"עיר"}];
const SENT=[{ar:"أنا بتعلم عبري",w:["אני","לומד","עברית"],x:["אתה","ערבית"]},{ar:"اسمي سامي",w:["שמי","סאמי"],x:["שמך","אני"]},{ar:"أنا من حيفا",w:["אני","מחיפה"],x:["מנצרת","אתה"]}];
const STEPS4=[{k:"intro"},{k:"trace"},{k:"kbd"},{k:"type"},{k:"sentence"},{k:"check"},{k:"done"}];
const TITLES4={intro:"مقدمة",trace:"خط اليد",kbd:"الكيبورد العبري",type:"اكتب الكلمة",sentence:"أول جملة",check:"صرت بقدر",done:"خلصت المستوى"};
const PASS4=7,CHECK4=10;
const R4={};
const handQ=l=>{const o=shuffle([l.h,...pick(LETTERS.map(x=>x.h),3,x=>x===l.h)]);return{prompt:`<span class="hand" lang="he">${l.h}</span><p class="lead">هاد حرف بخط اليد. أي حرف هو بالمطبوع؟</p>`,opts:o.map(x=>`<span class="he" lang="he">${x}</span>`),ans:o.indexOf(l.h),explain:`هاد ${he(l.h)} «${l.name}».`};};
const keyQ=()=>{const r=Math.floor(Math.random()*3),c=Math.floor(Math.random()*KB[r].length);const h=KB[r][c];if(!/[א-ת]/.test(h))return keyQ();const lat=KBLAT[r][c];const pool=KBLAT.flat().filter(x=>/[A-Z]/.test(x));const o=shuffle([lat,...pick(pool,3,x=>x===lat)]);return{prompt:`<span class="glyph" lang="he">${h}</span><p class="lead">على كيبورد الكمبيوتر، أي زر بيكتب هالحرف؟</p>`,opts:o,ans:o.indexOf(lat),explain:`${he(h)} موجود على زر ${lat}.`};};
const spellQ=()=>{const items=[["שלום","שלומ"],["מים","מימ"],["עין","עינ"],["ארץ","ארצ"],["מלך","מלכ"],["אף","אפ"]];const it=items[Math.floor(Math.random()*items.length)];const o=shuffle([it[0],it[1]]);return{prompt:`<p class="lead">أي كتابة صح؟</p>`,opts:o.map(x=>`<span class="he" lang="he">${x}</span>`),ans:o.indexOf(it[0]),explain:`الصح ${he(it[0])}، لأنه آخر حرف لازم يكون بشكله النهائي.`};};

R4.trace=()=>{const done=S.traced||(S.traced={});const need=5;let cur=LETTERS[0];
  screen.innerHTML=`<div class="stack pop"><h2>خط اليد</h2><p class="lead">اختار حرف، وامشي بإصبعك فوق الشكل الفاتح. اكتب ${need} حروف على الأقل. الكتابة من اليمين للشمال، ومن فوق لتحت.</p>
  <div class="trace-pick">${ALL.map(l=>`<button type="button" class="tp ${done[l.h]?"seen":""}" data-h="${l.h}" lang="he">${l.h}</button>`).join("")}</div>
  <div class="panel trace-box"><canvas id="pad" width="600" height="600" aria-label="مساحة الكتابة"></canvas></div>
  <div class="trace-actions"><button type="button" class="btn ghost" id="clr">امسح</button><button type="button" class="btn" id="ok">كتبته ✓</button></div>
  <p class="counter tcount">كتبت ${Object.keys(done).length} من ${need}</p></div>`;
  const cv=screen.querySelector("#pad"),ctx=cv.getContext("2d");
  const css=getComputedStyle(document.documentElement);
  function guide(){ctx.clearRect(0,0,600,600);ctx.fillStyle=css.getPropertyValue("--sunk").trim()||"#eee";ctx.fillRect(0,0,600,600);
    ctx.strokeStyle=css.getPropertyValue("--line").trim()||"#ddd";ctx.lineWidth=2;ctx.setLineDash([10,10]);ctx.beginPath();ctx.moveTo(0,420);ctx.lineTo(600,420);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle=css.getPropertyValue("--line").trim()||"#ccc";ctx.font='380px "Gveret Levin","Frank Ruhl Libre",serif';ctx.textAlign="center";ctx.textBaseline="alphabetic";ctx.fillText(cur.h,300,420);}
  const draw=()=>{if(document.fonts&&document.fonts.load){document.fonts.load('380px "Gveret Levin"').then(guide,guide);}else guide();};
  draw();
  let down=false,last=null;
  const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*600/r.width,(e.clientY-r.top)*600/r.height];};
  cv.addEventListener("pointerdown",e=>{down=true;last=pt(e);cv.setPointerCapture(e.pointerId);});
  cv.addEventListener("pointermove",e=>{if(!down)return;const p=pt(e);ctx.strokeStyle=css.getPropertyValue("--accent").trim()||"#6C3CE1";ctx.lineWidth=16;ctx.lineCap="round";ctx.lineJoin="round";ctx.beginPath();ctx.moveTo(last[0],last[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();last=p;});
  ["pointerup","pointercancel","pointerleave"].forEach(ev=>cv.addEventListener(ev,()=>{down=false;}));
  screen.querySelectorAll(".tp").forEach(b=>b.addEventListener("click",()=>{cur=ALL.find(x=>x.h===b.dataset.h);screen.querySelectorAll(".tp").forEach(x=>x.classList.toggle("on",x===b));draw();}));
  screen.querySelector(".tp").classList.add("on");
  screen.querySelector("#clr").addEventListener("click",draw);
  screen.querySelector("#ok").addEventListener("click",()=>{if(!done[cur.h]){done[cur.h]=1;addXP(3);}save();screen.querySelector(`.tp[data-h="${cur.h}"]`).classList.add("seen");const n=Object.keys(done).length;screen.querySelector(".tcount").textContent=`كتبت ${n} من ${need}`;if(n>=need)refreshNav(true);const i=ALL.indexOf(cur),nx=ALL[(i+1)%ALL.length];cur=nx;screen.querySelectorAll(".tp").forEach(x=>x.classList.toggle("on",x.dataset.h===nx.h));draw();});
  return Object.keys(done).length>=need;};

R4.sentence=()=>{let si=0;
  function render(){const t=SENT[si],tiles=shuffle([...t.w,...t.x]);let picked=[];
    screen.innerHTML=`<div class="stack pop"><h2>أول جملة</h2><p class="lead">ركّب الجملة بالعبري. الجملة العبرية بتنقرأ من اليمين للشمال زي العربي. (${si+1} من ${SENT.length})</p>

    <div class="wtiles" dir="rtl">${tiles.map(w=>`<button type="button" class="wtile" lang="he">${w}</button>`).join("")}</div>
    <button type="button" class="btn ghost undo">امسح آخر كلمة</button></div><div class="wfb"></div></div>`;
    const box=screen.querySelector(".sent"),fb=screen.querySelector(".wfb");
    const paint=()=>{box.textContent=picked.map(x=>x.w).join(" ");};

      if(picked.length===t.w.length){const ok=picked.map(x=>x.w).join(" ")===t.w.join(" ");box.classList.add(ok?"ok":"no");
        if(ok){addXP(10);speak(t.w.join(" "));const last=si+1>=SENT.length;fb.innerHTML=`<div class="feedback good">صح! ${he(t.w.join(" "))} = ${t.ar}</div>`+(last?"":'<button type="button" class="btn nx" style="width:100%;margin-top:10px">الجملة الجاية</button>');
          if(last){S.done.sentence=1;save();refreshNav(true);}else fb.querySelector(".nx").addEventListener("click",()=>{si++;render();});}
        else fb.innerHTML=`<div class="feedback bad">قريب! امسح وجرب ترتيب ثاني.</div>`;}}));
    screen.querySelector(".undo").addEventListener("click",()=>{const x=picked.pop();if(x)x.b.disabled=false;box.classList.remove("ok","no");fb.innerHTML="";paint();});}

const lineOf=(arr)=>arr.map(G);
function makeUnit(D,idx,LV){
  const steps=[{k:"intro"}];if(D.gender)steps.push({k:"gender"});
  if(D.vocab)steps.push({k:"vocab"},{k:"drill"});
  const EX=(typeof EXTRA!=="undefined"&&EXTRA[D.id])?EXTRA[D.id]:null;if(EX)steps.push({k:"extra"},{k:"edrill"});
  if(D.grammar)steps.push({k:"grammar"},{k:"gdrill"});
  if(D.review)steps.push({k:"review"});
  if(D.root)steps.push({k:"root"});
  if(D.build)steps.push({k:"build"});
  if(D.dialog)steps.push({k:"dialog"});
  steps.push({k:"check"},{k:"done"});
  const titles={intro:"مقدمة",gender:"عرّفنا عليك",vocab:"كلمات الوحدة",drill:"تدريب الكلمات",extra:"كلمات إضافية",edrill:"تدريب الإضافية",grammar:"القاعدة",gdrill:"تدريب القاعدة",review:"مراجعة المستوى",root:"جذر الوحدة",build:"ركّب الجملة",dialog:D.dialog?D.dialog.title:"محادثة",check:"صرت بقدر",done:"خلصت"};
  const R={};
  const V=()=>D.vocab.map(v=>({h:G(v[0]),r:G(v[1]),m:G(v[2]),n:v[3]?G(v[3]):""}));
  const vq=(v,pool)=>{const o=shuffle([v,...pick(pool,3,x=>x.m===v.m)]);return{prompt:`<span class="word" lang="he">${esc(v.h)}</span><p class="lead">شو معناها؟</p>`,opts:o.map(x=>esc(x.m)),ans:o.indexOf(v),explain:`${he(v.h)} «${esc(v.r)}» = ${esc(v.m)}.`};};
  const vq2=(v,pool)=>{const o=shuffle([v,...pick(pool,3,x=>x.h===v.h)]);return{prompt:`<span class="target">${esc(v.m)}</span><p class="lead">كيف بتحكيها بالعبري؟</p>`,opts:o.map(x=>`<span class="he" lang="he">${esc(x.h)}</span>`),ans:o.indexOf(v),explain:`${esc(v.m)} = ${he(v.h)} «${esc(v.r)}».`};};
  const gq=q=>{const right=G(q[1]),wrong=q[2].map(G).filter(x=>x!==right);const o=shuffle([right,...wrong.slice(0,3)]);return{prompt:`<span class="target" style="font-size:22px">${esc(G(q[0]))}</span><p class="lead">أي وحدة صح؟</p>`,opts:o.map(x=>`<span class="he" lang="he">${esc(x)}</span>`),ans:o.indexOf(right),explain:`الصح: ${he(right)}.`};};
  const allPrev=()=>LV.list.slice(0,idx).filter(x=>x.vocab).flatMap(x=>x.vocab.map(v=>({h:G(v[0]),r:G(v[1]),m:G(v[2])})));
  const allQs=()=>LV.list.slice(0,idx).filter(x=>x.grammar).flatMap(x=>x.grammar.qs);

  R.intro=()=>{screen.innerHTML=`<div class="stack pop"><h1>${D.h1}</h1><p class="lead">${D.lead}</p>
    <div class="panel hero"><span class="glyph" lang="he" style="font-size:46px">${esc(G(D.hero))}</span></div>
    <div class="note"><b>بنهاية الوحدة رح تقدر:</b> ${D.goal}</div></div>`;return true;};
  R.gender=()=>{const g=S.g;screen.innerHTML=`<div class="stack pop"><h2>عرّفنا عليك</h2>
    <p class="lead">العبري زي العربي، بيفرق بين الحكي مع شب والحكي مع صبية. عشان نعلمك الجمل الصح إلك بكل المستوى، انت:</p>
    <div class="opts"><button type="button" class="opt g-pick ${g==="m"?"right":""}" data-g="m">شب</button><button type="button" class="opt g-pick ${g==="f"?"right":""}" data-g="f">صبية</button></div>
    <p class="lead" style="font-size:14px">بتقدر تغيره بأي وقت إذا رجعت لهالخطوة.</p></div>`;
    screen.querySelectorAll(".g-pick").forEach(b=>b.addEventListener("click",()=>{S.g=b.dataset.g;save();screen.querySelectorAll(".g-pick").forEach(x=>x.classList.toggle("right",x===b));refreshNav(true);}));
    return !!S.g;};
  R.vocab=()=>{const v=V();screen.innerHTML=`<div class="stack pop"><h2>كلمات الوحدة</h2><p class="lead">اسمع كل كلمة وردّدها بصوت عالي.</p>
    <div class="rows">${v.map(x=>`<div class="row"><div><span class="he" lang="he">${esc(x.h)}</span><small>«${esc(x.r)}» = ${esc(x.m)}${x.n?` · ${esc(x.n)}`:""}</small></div>${speakBtn(x.h)}</div>`).join("")}</div></div>`;return true;};
  R.drill=()=>quizScreen("drill","","تدريب الكلمات","من العبري للعربي ومن العربي للعبري.",()=>{const v=V();return shuffle([...pick(v,5).map(x=>vq(x,v)),...pick(v,5).map(x=>vq2(x,v))]);});
  const XV=()=>EX.map(v=>({h:G(v[0]),r:G(v[1]),m:G(v[2])}));

function refreshNav(can){
  const k=STEPS[S.step].k;
  nextBtn.disabled=!can||k==="done";
  nextBtn.textContent=k==="intro"?"يلا نبلش":k==="check"?(can?"شوف إنجازك":"خلّص الفحص أول"):k==="done"?"خلصت الوحدة":"التالي";
  backBtn.hidden=S.step===0;
}
function go(n){
  S.step=Math.max(0,Math.min(STEPS.length-1,n));save();
  const st=STEPS[S.step];
  $("crumb").textContent=`${CRUMB} · ${st.p?"الجزء "+st.p+" · ":""}${TITLES[st.k]}`;
  $("bar").style.width=(S.step/(STEPS.length-1)*100)+"%";
  ($("lessonView")||window).scrollTo(0,0);
  refreshNav(R[st.k](st.p));
}
nextBtn.addEventListener("click",()=>{if(S)go(S.step+1);});
backBtn.addEventListener("click",()=>{if(S)go(S.step-1);});
function open(id){UNIT=id;const u=UNITS[id];STEPS=u.steps;TITLES=u.titles;R=u.screens;CRUMB=u.crumb;S=loadState(id);$("xp").textContent=S.xp+" نقطة";go(S.step);}

{id:"1-2", title:"הַמִּשְׁפָּחָה שֶׁלִּי", ar:"عيلتي", kind:"رسالة", nq:true,
 segs:[
  {he:"שָׁלוֹם מָאיָה! מַה שְּׁלוֹמֵךְ?\nזֹאת הַמִּשְׁפָּחָה שֶׁלִּי. אֲנַחְנוּ בְּחֵיפָה. סָאמִי הוּא הַבַּעַל שֶׁלִּי. הוּא מֵעַכּוֹ, וַאֲנִי מִנָּצְרַת.",
   ar:"مرحبا يا مايا! كيف حالك؟\nهاي عيلتي. احنا بحيفا. سامي هو جوزي. هو من عكا، وأنا من الناصرة.",
   q:{q:"من وين لينا؟", o:["من عكا","من الناصرة","من إيلات"], a:1}},
  {he:"יֵשׁ לָנוּ יְלָדִים: בֵּן וּבַת. הַבֵּן שֶׁלָּנוּ הוּא כָּרִים, וְהַבַּת שֶׁלָּנוּ הִיא נוּר. כָּרִים גָּדוֹל, וְנוּר קְטַנָּה. הַיְּלָדִים נֶחְמָדִים, אֲבָל לֹא בַּבֹּקֶר!",
   ar:"عنا ولاد: ابن وبنت. ابننا كريم، وبنتنا نور. كريم كبير، ونور زغيرة. الولاد لطاف، بس مش الصبح!",
   q:{q:"مين البنت الزغيرة؟", o:["مايا","لينا","دانا","نور"], a:3}},
  {he:"הַהוֹרִים שֶׁלִּי בְּנָצְרַת. אַבָּא שֶׁלִּי מוֹרֶה, וְאִמָּא שֶׁלִּי עוֹרֶכֶת דִּין. יֵשׁ לִי גַּם אָח וְאָחוֹת. הָאָח שֶׁלִּי, עוֹמֶר, בְּתֵל אָבִיב, וְהָאָחוֹת שֶׁלִּי בְּאֵילַת. וְאַתְּ? יֵשׁ לָךְ אַחִים?\nלְהִתְרָאוֹת, לִינָה",
   ar:"أهلي بالناصرة. أبوي معلم، وإمي محامية. وعندي كمان أخ وأخت. أخوي عمر بتل أبيب، وأختي بإيلات. وانتِ؟ عندك إخوة؟\nمع السلامة، لينا",
   q:{q:"شو بتشتغل إم لينا؟", o:["معلمة","محامية","مهندسة"], a:1}}],
 tf:[["سامي هو جوز لينا.", true],["عند لينا وسامي ثلاث ولاد.", false],["أبو لينا معلم.", true],["أخو لينا ساكن بإيلات.", false],["الولاد مش لطاف الصبح.", true]],
 find:{q:"وين أهل لينا؟", a:"הַהוֹרִים שֶׁלִּי בְּנָצְרַת."},
 words:[["מִשְׁפָּחָה","ميشپاحا","عيلة"],["בַּעַל","بَعَل","جوز"],["בֵּן","بين","ابن"],["בַּת","بات","بنت"],["הוֹרִים","هوريم","أهل"],["אָח","أح","أخ"],["אָחוֹת","أحوت","أخت"],["קְטַנָּה","كتانا","زغيرة"]]

{id:"1-3", title:"מָה הַשָּׁעָה?", ar:"قديش الساعة؟", kind:"لافتة وحوار", nq:true,
 segs:[
  {he:"סִפְרִיַּת הָעִיר: שְׁעוֹת פְּתִיחָה\nבַּבֹּקֶר: מִשְּׁמוֹנֶה עַד אַחַת.\nבַּצָּהֳרַיִם: סָגוּר.\nאַחַר הַצָּהֳרַיִם: מֵאַרְבַּע עַד שֶׁבַע.\nבְּיוֹם שִׁישִּׁי: מִשְּׁמוֹנֶה עַד שְׁתֵּים עֶשְׂרֵה.",
   ar:"مكتبة البلد: ساعات الدوام\nالصبح: من ثمانية لوحدة.\nالضهر: مسكّر.\nبعد الضهر: من أربعة لسبعة.\nيوم الجمعة: من ثمانية لـ ١٢.",
   q:{q:"إمتى بتفتح المكتبة بعد الضهر؟", o:["الساعة وحدة","الساعة أربعة","الساعة سبعة"], a:1}},
  {he:"לִינָה: סָאמִי, מָה הַשָּׁעָה?\nסָאמִי: הַשָּׁעָה שָׁלוֹשׁ וָרֶבַע.\nלִינָה: אוֹי, הַסִּפְרִיָּה סְגוּרָה עַכְשָׁיו.\nסָאמִי: אָז יֵשׁ לָנוּ אַרְבָּעִים וְחָמֵשׁ דַּקּוֹת. קָפֶה?\nלִינָה: כֵּן! קָפֶה וְעוּגָה!",
   ar:"لينا: سامي، قديش الساعة؟\nسامي: الساعة ثلاثة وربع.\nلينا: أوف، المكتبة مسكّرة هلأ.\nسامي: يعني عنا ٤٥ دقيقة. قهوة؟\nلينا: أيوا! قهوة وكعكة!",
   q:{q:"قديش كانت الساعة؟", o:["ثلاثة وربع","أربعة ونص","ثلاثة إلا ربع","خمسة"], a:0}},
  {he:"בְּאַרְבַּע בְּדִיּוּק סָאמִי וְלִינָה בַּסִּפְרִיָּה. אֲבָל הַדֶּלֶת סְגוּרָה! עַל הַדֶּלֶת יֵשׁ פֶּתֶק: «הַיּוֹם הַסִּפְרִיָּה פְּתוּחָה רַק מֵחָמֵשׁ.»\nסָאמִי צוֹחֵק: «עוֹד קָפֶה?»",
   ar:"الساعة أربعة بالزبط سامي ولينا عند المكتبة. بس الباب مسكّر! عالباب في ورقة: «اليوم المكتبة فاتحة بس من الساعة خمسة.»\nسامي بيضحك: «كمان قهوة؟»",
   q:{q:"ليش الباب مسكّر الساعة أربعة؟", o:["لأنه يوم جمعة","لأن المكتبة اليوم بتفتح من خمسة","لأن سامي نسي المفتاح"], a:1}}],
 tf:[["المكتبة مسكّرة الضهر.", true],["يوم الجمعة المكتبة فاتحة لسبعة.", false],["سامي ولينا بيروحوا يشربوا قهوة.", true],["الساعة أربعة المكتبة فاتحة.", false]],
 order:["لينا بتسأل قديش الساعة","سامي بيقترح قهوة","بيوصلوا عالمكتبة الساعة أربعة","بيشوفوا ورقة عالباب"],
 find:{q:"شو مكتوب عالورقة اللي عالباب؟", a:"הַיּוֹם הַסִּפְרִיָּה פְּתוּחָה רַק מֵחָמֵשׁ."},
 words:[["שָׁעָה","شاعا","ساعة"],["רֶבַע","ريڤَع","ربع"],["דַּקּוֹת","دَكّوت","دقايق"],["פָּתוּחַ / פְּתוּחָה","پاتوَح / پتوحا","فاتح / فاتحة"],["סָגוּר / סְגוּרָה","ساچور / سچورا","مسكّر / مسكّرة"],["עַכְשָׁיו","عَخشاڤ","هلأ"],["בְּדִיּוּק","بِدِيّوك","بالزبط"]]
},
{id:"1-4", title:"בַּשּׁוּק", ar:"بالسوق", kind:"حوار", nq:true,
 segs:[
  {he:"הַמּוֹכֵר: בֹּקֶר טוֹב! מָה אַתְּ רוֹצָה?\nלִינָה: בֹּקֶר טוֹב. כַּמָּה עוֹלֶה קִילוֹ עַגְבָנִיּוֹת?\nהַמּוֹכֵר: שִׁבְעָה שְׁקָלִים.\nלִינָה: וְהַתַּפּוּחִים?\nהַמּוֹכֵר: עֲשָׂרָה שְׁקָלִים לַקִּילוֹ.",
   ar:"البياع: صباح الخير! شو بدك؟\nلينا: صباح النور. قديش حق كيلو البندورة؟\nالبياع: سبعة شيكل.\nلينا: والتفاح؟\nالبياع: عشرة شيكل الكيلو.",
   q:{q:"قديش حق كيلو البندورة؟", o:["عشرة شيكل","خمسة شيكل","سبعة شيكل"], a:2}},
  {he:"לִינָה: עֲשָׂרָה שְׁקָלִים? זֶה יָקָר!\nהַמּוֹכֵר: יָקָר? אֵלֶּה תַּפּוּחִים מֵהַגָּלִיל! הֵם מְתוּקִים מְאוֹד.\nלִינָה: טוֹב. תֵּן לִי קִילוֹ עַגְבָנִיּוֹת וַחֲצִי קִילוֹ תַּפּוּחִים. וְגַם קִילוֹ מְלָפְפוֹנִים.\nהַמּוֹכֵר: הַמְּלָפְפוֹנִים זוֹלִים: שְׁמוֹנָה שְׁקָלִים.",
   ar:"لينا: عشرة شيكل؟ هاد غالي!\nالبياع: غالي؟ هدول تفاح من الجليل! حلوين كتير.\nلينا: ماشي. عطيني كيلو بندورة ونص كيلو تفاح. وكمان كيلو خيار.\nالبياع: الخيار رخيص: ثمانية شيكل.",
   q:{q:"قديش تفاح بتشتري لينا؟", o:["كيلو","نص كيلو","ولا إشي","كيلوين"], a:1}},
  {he:"לִינָה: כַּמָּה זֶה עוֹלֶה?\nהַמּוֹכֵר: עֶשְׂרִים שְׁקָלִים.\nלִינָה: בְּבַקָּשָׁה. אֶפְשָׁר שַׂקִּית?\nהַמּוֹכֵר: בֶּטַח! וְזֶה תַּפּוּחַ מַתָּנָה, בִּשְׁבִילֵךְ.\nלִינָה: תּוֹדָה! אַתָּה מוֹכֵר נֶחְמָד מְאוֹד.",
   ar:"لينا: قديش الحساب؟\nالبياع: عشرين شيكل.\nلينا: تفضل. ممكن كيس؟\nالبياع: أكيد! وهاي تفاحة هدية، إلك.\nلينا: شكرًا! انت بياع لطيف كتير.",
   q:{q:"شو بيعطي البياع للينا هدية؟", o:["كيس بندورة","تفاحة","خيارة"], a:1}}],
 tf:[["لينا بتحكي إن التفاح غالي.", true],["التفاح من إيلات.", false],["الحساب كله عشرين شيكل.", true],["البياع ما بيعطيها كيس.", false]],
 order:["لينا بتسأل عن سعر البندورة","لينا بتحكي إن التفاح غالي","لينا بتطلب خيار كمان","البياع بيعطيها تفاحة هدية"],
 find:{q:"شو بيحكي البياع عن التفاح؟", a:"הֵם מְתוּקִים מְאוֹד."},
 words:[["כַּמָּה זֶה עוֹלֶה?","كاما زيه عوليه؟","قديش حقه؟"],["שֶׁקֶל / שְׁקָלִים","شيكِل / شكاليم","شيكل / شواكل"],["עַגְבָנִיּוֹת","عَچڤانيوت","بندورة"],["תַּפּוּחִים","تَپوحيم","تفاح"],["מְלָפְפוֹנִים","مِلافيفونيم","خيار"],["יָקָר","ياكار","غالي"],["זוֹל","زول","رخيص"],["שַׂקִּית","سَكيت","كيس"]]

{id:"1-5", title:"בַּמִּסְעָדָה", ar:"بالمطعم", kind:"قائمة طعام وحوار", nq:true,
 segs:[
  {he:"מִסְעֶדֶת הַגָּלִיל: תַּפְרִיט\nפָלָאפֶל בְּפִיתָה: עֶשְׂרִים שְׁקָלִים\nצַלַּחַת חוּמוּס: שְׁלוֹשִׁים שְׁקָלִים\nסָלָט יְרָקוֹת: עֶשְׂרִים וַחֲמִשָּׁה שְׁקָלִים\nקָפֶה: עֲשָׂרָה שְׁקָלִים\nמַיִם: חֲמִשָּׁה שְׁקָלִים",
   ar:"مطعم الجليل: المنيو\nفلافل بخبزة: عشرين شيكل\nصحن حمص: ثلاثين شيكل\nسلطة خضرا: ٢٥ شيكل\nقهوة: عشرة شيكل\nمي: خمسة شيكل",
   q:{q:"قديش حق صحن الحمص؟", o:["عشرين شيكل","٢٥ شيكل","ثلاثين شيكل","عشرة شيكل"], a:2}},
  {he:"הַמֶּלְצַר: עֶרֶב טוֹב! מָה אַתֶּם רוֹצִים?\nסָאמִי: אֲנִי רָעֵב מְאוֹד! אֲנִי רוֹצֶה צַלַּחַת חוּמוּס וּפָלָאפֶל בְּפִיתָה.\nלִינָה: וַאֲנִי רוֹצָה סָלָט. בָּעֶרֶב אֲנִי לֹא אוֹכֶלֶת הַרְבֵּה.\nהַמֶּלְצַר: וּמָה אַתֶּם שׁוֹתִים?\nלִינָה: מַיִם, בְּבַקָּשָׁה. אֲנִי צְמֵאָה.",
   ar:"الجرسون: مسا الخير! شو بدكم؟\nسامي: أنا جوعان كتير! بدي صحن حمص وفلافل بخبزة.\nلينا: وأنا بدي سلطة. بالمسا ما باكل كتير.\nالجرسون: وشو بتشربوا؟\nلينا: مي، لو سمحت. أنا عطشانة.",
   q:{q:"شو بتطلب لينا تاكل؟", o:["حمص","فلافل","سلطة"], a:2}},
  {he:"הַחוּמוּס מַגִּיעַ. סָאמִי אוֹכֵל וְאוֹמֵר: «מַמָּשׁ טָעִים!»\nלִינָה אוֹכֶלֶת קְצָת חוּמוּס... וְעוֹד קְצָת... וְעוֹד פָלָאפֶל.\nסָאמִי צוֹחֵק: «סְלִיחָה! עוֹד צַלַּחַת חוּמוּס, בְּבַקָּשָׁה. וְאַחַר כָּךְ הַחֶשְׁבּוֹן.»",
   ar:"الحمص بيوصل. سامي بياكل وبيحكي: «عنجد طيب!»\nلينا بتاكل شوية حمص... وكمان شوية... وكمان فلافل.\nسامي بيضحك: «لو سمحت! كمان صحن حمص. وبعدين الحساب.»",
   q:{q:"ليش سامي بيطلب كمان صحن حمص؟", o:["لأن لينا أكلت من أكله","لأن الحمص مش طيب","لأن الجرسون نسي الطلب"], a:0}}],

{id:"1-6", title:"אֵיךְ מַגִּיעִים אֵלַי?", ar:"كيف بتوصلوا لعندي؟", kind:"رسالة", nq:true,
 segs:[
  {he:"שָׁלוֹם לִינָה וְסָאמִי!\nהָעֶרֶב אַתֶּם אֶצְלִי בְּעַכּוֹ. אֵיךְ מַגִּיעִים? זֶה לֹא רָחוֹק. מֵחֵיפָה יֵשׁ רַכֶּבֶת לְעַכּוֹ כָּל חֲצִי שָׁעָה, וְזֶה רַק עֶשְׂרִים דַּקּוֹת. אַתֶּם יוֹרְדִים בַּתַּחֲנָה בְּעַכּוֹ.",
   ar:"مرحبا لينا وسامي!\nالليلة انتو عندي بعكا. كيف بتوصلوا؟ مش بعيد. من حيفا في قطار لعكا كل نص ساعة، وبس عشرين دقيقة. بتنزلوا بمحطة عكا.",
   q:{q:"كل قديش في قطار من حيفا لعكا؟", o:["كل ساعة","كل نص ساعة","كل ربع ساعة"], a:1}},
  {he:"מוּל הַתַּחֲנָה יֵשׁ אוֹטוֹבּוּס, קַו שָׁלוֹשׁ. אַתֶּם עוֹלִים לָאוֹטוֹבּוּס עִם הָרַב־קַו, וְיוֹרְדִים אַחֲרֵי אַרְבַּע תַּחֲנוֹת, לְיַד הַבַּנְק.",
   ar:"قبال المحطة في باص، خط ثلاثة. بتطلعوا عالباص مع الراڤ كاڤ، وبتنزلوا بعد أربع محطات، جنب البنك.",
   q:{q:"وين بينزلوا من الباص؟", o:["جنب البنك","جنب المكتبة","قبال المحطة","جنب الشط"], a:0}},
  {he:"מֵהַבַּנְק זֶה קָרוֹב: יָשָׁר, וְאַחַר כָּךְ שְׂמֹאלָה. הַבַּיִת שֶׁלִּי בֵּין הַמַּכּוֹלֶת וְהַפַּארְק. זֶה בַּיִת לָבָן עִם דֶּלֶת כְּחוּלָה. אֲנִי בַּבַּיִת מֵחָמֵשׁ.\nלְהִתְרָאוֹת בָּעֶרֶב!\nמָאיָה",
   ar:"من البنك قريب: دغري، وبعدين شمال. بيتي بين الدكانة والحديقة. بيت أبيض وبابه أزرق. أنا بالبيت من الساعة خمسة.\nبنشوفكم بالليل!\nمايا",
   q:{q:"وين بيت مايا؟", o:["جنب المحطة","بين الدكانة والحديقة","فوق البنك"], a:1}}],
 tf:[["مايا ساكنة بعكا.", true],["لازم ياخدوا الباص خط عشرة.", false],["بعد البنك بيمشوا دغري وبعدين شمال.", true],["باب بيت مايا أحمر.", false]],
 order:["بياخدوا القطار من حيفا","بينزلوا بمحطة عكا","بيطلعوا عالباص خط ثلاثة","بينزلوا جنب البنك","بيمشوا دغري وبعدين شمال"],
 find:{q:"كيف شكل بيت مايا؟", a:"זֶה בַּיִת לָבָן עִם דֶּלֶת כְּחוּלָה."},
 words:[["רַכֶּבֶת","راكيڤِت","قطار"],["תַּחֲנָה","تاحانا","محطة"],["קַו","كاڤ","خط"],["לַעֲלוֹת / עוֹלִים","لاعَلوت / عوليم","يطلع / بيطلعوا"],["לָרֶדֶת / יוֹרְדִים","لاريديت / يورديم","ينزل / بينزلوا"],["יָשָׁר","ياشار","دغري"],["שְׂמֹאלָה","سمولا","شمال"],["בֵּין","بين","بين"]]
},
{id:"1-7", title:"דִּירָה לְהַשְׂכָּרָה", ar:"شقة للإيجار", kind:"إعلان", nq:true,
 segs:[
  {he:"לְהַשְׂכָּרָה בִּטְבֶרְיָה!\nדִּירָה יָפָה: סָלוֹן, שְׁנֵי חַדְרֵי שֵׁנָה וּמִטְבָּח גָּדוֹל. יֵשׁ מִקְלַחַת וְשֵׁירוּתִים. יֵשׁ מִרְפֶּסֶת עִם נוֹף לַכִּנֶּרֶת! קוֹמָה רְבִיעִית, יֵשׁ מַעֲלִית. הַדִּירָה פְּנוּיָה עַכְשָׁיו.\nלִפְרָטִים: יוֹסִי.",
   ar:"للإيجار بطبريا!\nشقة حلوة: صالون، وغرفتين نوم ومطبخ كبير. في دوش وتواليت. في برندة بتطل عالبحيرة (طبريا)! طابق رابع، في مصعد. الشقة فاضية هلأ.\nللتفاصيل: يوسي.",
   q:{q:"قديش غرفة نوم في بالشقة؟", o:["وحدة","ثلاثة","ثنتين"], a:2}},
  {he:"עוֹמֶר: שָׁלוֹם, יוֹסִי. הַדִּירָה עוֹד פְּנוּיָה?\nיוֹסִי: כֵּן, פְּנוּיָה.\nעוֹמֶר: יֵשׁ חֲנָיָה?\nיוֹסִי: אֵין חֲנָיָה, אֲבָל יֵשׁ מָקוֹם בָּרְחוֹב.\nעוֹמֶר: וְיֵשׁ מַזְגָן?\nיוֹסִי: כֵּן, יֵשׁ מַזְגָן בְּכָל חֶדֶר.",
   ar:"عمر: مرحبا يا يوسي. الشقة لسا فاضية؟\nيوسي: أيوا، فاضية.\nعمر: في موقف؟\nيوسي: ما في موقف، بس في محل بالشارع.\nعمر: وفي مكيف؟\nيوسي: أيوا، في مكيف بكل غرفة.",
   q:{q:"شو ما في بالشقة؟", o:["مكيف","موقف","مصعد","برندة"], a:1}},
  {he:"עוֹמֶר: וּמִי הַשְּׁכֵנִים?\nיוֹסִי: הַשְּׁכֵנָה מִמּוּל, טַל, נֶחְמָדָה מְאוֹד. אֲבָל הַשָּׁכֵן מִלְמַעְלָה הוּא מוּזִיקַאי, וְהוּא מְנַגֵּן כָּל לַיְלָה.\nעוֹמֶר: אֵין בְּעָיָה. גַּם אֲנִי מוּזִיקַאי!\nיוֹסִי: אוֹי...",
   ar:"عمر: ومين الجيران؟\nيوسي: الجارة اللي قبال، طال، لطيفة كتير. بس الجار اللي فوق موسيقي، وبيعزف كل ليلة.\nعمر: ما في مشكلة. أنا كمان موسيقي!\nيوسي: يا ويلي...",
   q:{q:"ليش عمر بيحكي «ما في مشكلة»؟", o:["لأنه هو كمان موسيقي","لأنه بينام بكّير","لأنه ما بيسمع منيح"], a:0}}],
 tf:[["الشقة بطبريا.", true],["ما في مصعد بالبناية.", false],["الجارة طال لطيفة.", true],["الجار اللي فوق بيعزف بس الصبح.", false]],
 find:{q:"وين في مكيف بالشقة؟", a:"כֵּן, יֵשׁ מַזְגָן בְּכָל חֶדֶר."},
 words:[["דִּירָה","ديرا","شقة"],["חֲדַר שֵׁינָה","حَدَر شيناه","غرفة نوم"],["מִרְפֶּסֶת","ميرپيسِت","برندة"],["קוֹמָה","كوما","طابق"],["מַעֲלִית","مَعَليت","مصعد"],["פְּנוּיָה","پنويا","فاضية"],["יֵשׁ / אֵין","ييش / إين","في / ما في"],["שָׁכֵן / שְׁכֵנָה","شاخين / شخينا","جار / جارة"]]
},
{id:"1-8", title:"הַיּוֹמָן שֶׁל לִינָה", ar:"يوميات لينا", kind:"يوميات", nq:true,
 segs:[
  {he:"יוֹם רִאשׁוֹן\nכָּל יוֹם אֲנִי קָמָה בְּשֵׁשׁ וָחֵצִי. אֲנִי אוֹכֶלֶת אֲרוּחַת בֹּקֶר עִם סָאמִי וְהַיְּלָדִים. אַחַר כָּךְ אֲנִי נוֹסַעַת לָעֲבוֹדָה בָּאוֹטוֹבּוּס. אֲנִי עוֹבֶדֶת בְּמִשְׂרָד קָטָן.",
   ar:"يوم الأحد\nكل يوم بصحى الساعة ستة ونص. بفطر مع سامي والولاد. بعدين بروح عالشغل بالباص. بشتغل بمكتب زغير.",
   q:{q:"كيف بتروح لينا عالشغل؟", o:["بالقطار","بالسيارة","بالباص","مشي"], a:2}},
  {he:"בַּצָּהֳרַיִם אֲנִי אוֹכֶלֶת עִם חֲבֵרָה. בְּאַרְבַּע אֲנִי חוֹזֶרֶת הַבַּיְתָה. בָּעֶרֶב אֲנִי מְבַשֶּׁלֶת. בְּיוֹם שֵׁנִי וּבְיוֹם רְבִיעִי אֲנִי לוֹמֶדֶת אַנְגְּלִית בָּעֶרֶב. בַּלַּיְלָה אֲנִי הוֹלֶכֶת לִישׁוֹן בְּאַחַת עֶשְׂרֵה.",
   ar:"الضهر باكل مع صاحبتي. الساعة أربعة برجع عالبيت. بالمسا بطبخ. يوم الإثنين ويوم الأربعا بتعلم إنجليزي بالمسا. بالليل بروح أنام الساعة ١١.",
   q:{q:"إمتى بتتعلم لينا إنجليزي؟", o:["الأحد والخميس","الإثنين والأربعا","كل يوم الصبح"], a:1}},
  {he:"יוֹם שִׁישִּׁי\nאֵין עֲבוֹדָה! הַיּוֹם אֲנִי לֹא קָמָה בְּשֵׁשׁ וָחֵצִי... אֲנִי קָמָה בְּשֵׁשׁ. לָמָּה? כִּי הַיְּלָדִים קָמִים בְּשֵׁשׁ! בַּצָּהֳרַיִם אֲנַחְנוּ נוֹסְעִים לְנָצְרַת, לְסָבָא וְסַבְתָּא.",
   ar:"يوم الجمعة\nما في شغل! اليوم ما بصحى ستة ونص... بصحى ستة. ليش؟ لأنه الولاد بيصحوا ستة! الضهر منروح عالناصرة، لعند سيدهم وستهم.",
   q:{q:"ليش لينا بتصحى بكّير يوم الجمعة؟", o:["عندها شغل","الولاد بيصحوا ستة","عندها درس إنجليزي"], a:1}}],
 tf:[["لينا بتصحى كل يوم ستة ونص.", true],["لينا بترجع عالبيت الساعة سبعة.", false],["لينا بتطبخ بالمسا.", true],["يوم الجمعة لينا بتنام للضهر.", false]],
 order:["لينا بتصحى ستة ونص","بتفطر مع العيلة","بتروح عالشغل بالباص","بترجع عالبيت الساعة أربعة","بتروح تنام الساعة ١١"],
 find:{q:"شو بتعمل العيلة يوم الجمعة الضهر؟", a:"בַּצָּהֳרַיִם אֲנַחְנוּ נוֹסְעִים לְנָצְרַת, לְסָבָא וְסַבְתָּא."},
 words:[["קָמָה","كاما","بتصحى"],["נוֹסַעַת","نوسَعَت","بتروح (بتسافر)"],["עוֹבֶדֶת","عوڤيدِت","بتشتغل"],["חוֹזֶרֶת","حوزيرِت","بترجع"],["לוֹמֶדֶת","لوميدِت","بتتعلم"],["הַבַּיְתָה","هابايتا","عالبيت"],["אַחַר כָּךְ","أحار كاخ","بعدين"],["יוֹם שִׁישִּׁי","يوم شيشي","يوم الجمعة"]]
},
{id:"1-9", title:"סָאמִי חוֹלֶה", ar:"سامي مريض", kind:"قصة", nq:true,
 segs:[
  {he:"סָאמִי לֹא מַרְגִּישׁ טוֹב. כּוֹאֵב לוֹ הָרֹאשׁ, וְכוֹאֵב לוֹ הַגָּרוֹן. יֵשׁ לוֹ גַּם שִׁיעוּל.\nלִינָה: יֵשׁ לְךָ חוֹם?\nסָאמִי: כֵּן, שְׁלוֹשִׁים וּשְׁמוֹנֶה.\nלִינָה: אַתָּה חוֹלֶה. הַיּוֹם אַתָּה לֹא בָּעֲבוֹדָה, אַתָּה בְּקוּפַּת חוֹלִים!",
   ar:"سامي مش حاسس حاله منيح. راسه بوجعه، وحلقه بوجعه. وعنده كمان كحة.\nلينا: عندك حرارة؟\nسامي: أيوا، ٣٨.\nلينا: انت مريض. اليوم مش رايح عالشغل، رايح عالعيادة (كوپات حوليم)!",
   q:{q:"قديش حرارة سامي؟", o:["٣٧","٣٨","٣٩"], a:1}},
  {he:"בְּקוּפַּת חוֹלִים הָרוֹפְאָה שׁוֹאֶלֶת: «מַה כּוֹאֵב לְךָ?»\nסָאמִי: «הָרֹאשׁ, הַגָּרוֹן... וְגַם הַבֶּטֶן כּוֹאֶבֶת לִי.»\nהָרוֹפְאָה: «זֶה לֹא רְצִינִי. אַתָּה צָרִיךְ תְּרוּפָה וּמְנוּחָה. שְׁלוֹשָׁה יָמִים בַּבַּיִת.»",
   ar:"بالعيادة الدكتورة بتسأل: «شو بوجعك؟»\nسامي: «راسي، حلقي... وكمان بطني بتوجعني.»\nالدكتورة: «مش إشي خطير. بدك دوا وراحة. ثلاث أيام بالبيت.»",
   q:{q:"شو بتحكي الدكتورة؟", o:["إشي خطير كتير","بدو دوا وراحة","لازم يرجع عالشغل بكرا","ما في داعي لدوا"], a:1}},
  {he:"בְּבֵית הַמִּרְקַחַת סָאמִי קוֹנֶה אֶת הַתְּרוּפָה: כַּדּוּר אֶחָד, שָׁלוֹשׁ פְּעָמִים בַּיּוֹם.\nבַּבַּיִת לִינָה אוֹמֶרֶת: «מִסְכֵּן! כּוֹאֵב לְךָ הַגָּרוֹן?»\nסָאמִי: «כֵּן... אֲבָל הָעֵינַיִם בְּסֵדֶר. אָז יֵשׁ כַּדּוּרֶגֶל בַּטֶּלֶוִיזְיָה!»",
   ar:"بالصيدلية سامي بيشتري الدوا: حبة وحدة، ثلاث مرات باليوم.\nبالبيت لينا بتحكي: «يا حرام! حلقك بوجعك؟»\nسامي: «أيوا... بس عيوني منيحة. يعني في فوتبول عالتلفزيون!»",
   q:{q:"قديش مرة باليوم لازم سامي ياخد الحبة؟", o:["مرة وحدة","مرتين","ثلاث مرات"], a:2}}],
 tf:[["سامي عنده كحة.", true],["سامي بيروح عالشغل اليوم.", false],["سامي بيشتري الدوا من الصيدلية.", true],["عيون سامي بتوجعه.", false]],
 order:["سامي مش حاسس حاله منيح","لينا بتحكيله يروح عالعيادة","الدكتورة بتحكي بدو دوا وراحة","سامي بيشتري الدوا من الصيدلية","سامي بيحضر فوتبول بالبيت"],
 find:{q:"شو بتحكي الدكتورة إنه سامي محتاج؟", a:"אַתָּה צָרִיךְ תְּרוּפָה וּמְנוּחָה."},
 words:[["כּוֹאֵב לִי","كوئيڤ لي","بوجعني"],["רֹאשׁ","روش","راس"],["גָּרוֹן","چارون","حلق"],["בֶּטֶן","بِطِن","بطن"],["חוֹם","حوم","حرارة"],["שִׁיעוּל","شيعول","كحة"],["תְּרוּפָה","تروفا","دوا"],["בֵּית מִרְקַחַת","بيت ميركَحَت","صيدلية"]]
},
{id:"1-10", title:"הַשָּׁכֵן הֶחָדָשׁ", ar:"الجار الجديد", kind:"مقابلة", nq:true,
 segs:[
  {he:"רוֹן: שָׁלוֹם! אֲנִי רוֹן, מֵהָעִתּוֹן שֶׁל הַשְּׁכוּנָה. אֵיךְ קוֹרְאִים לְךָ?\nסָאמִי: נָעִים מְאוֹד. קוֹרְאִים לִי סָאמִי חַדָּאד.\nרוֹן: מֵאֵיפֹה אַתָּה, סָאמִי?\nסָאמִי: אֲנִי מֵעַכּוֹ, אֲבָל עַכְשָׁיו אֲנִי גָּר פֹּה, בְּחֵיפָה. הַדִּירָה שֶׁלָּנוּ בְּקוֹמָה רְבִיעִית.",

{id:"2-2", title:"טיול לאילת", ar:"رحلة عإيلات", kind:"رسالة", nq:false,
 segs:[
  {he:"היי חברים! יש לי תוכנית לחופש. בשבוע הבא אני לא אעבוד, כי לקחתי חמישה ימי חופש. ביום חמישי אסע עם לינה לאילת באוטו. ניסע בבוקר מוקדם, כי בצהריים יהיה חם מאוד בדרך. כבר מצאתי מלון קטן ליד הים.",
   ar:"هاي يا شباب! عندي خطة للعطلة. الأسبوع الجاي ما رح أشتغل، لأني أخدت خمس أيام عطلة. يوم الخميس رح أسافر مع لينا عإيلات بالسيارة. رح نسافر الصبح بكير، لأنه الضهر رح يكون شوب كتير بالطريق. خلص لقيت فندق صغير جنب البحر.",
   q:{q:"ليش رح يسافروا الصبح بكير؟", o:["لأنه في عجقة سير","لأنه الضهر رح يكون شوب كتير","لأن عندهم شغل بالمسا","لأن الباص بيطلع بكير"], a:1}},
  {he:"באילת נהיה שלושה ימים. נלך לים כל בוקר, ובערב נאכל במסעדות ליד הים. אולי אלמד לצלול! לינה אומרת שהיא תקרא ספר על החוף ולא תעשה כלום. ביום ראשון בערב נחזור הביתה.",
   ar:"بإيلات رح نكون تلات أيام. رح نروح عالبحر كل صبح، وبالمسا رح ناكل بمطاعم جنب البحر. يمكن أتعلّم غطس! لينا بتقول إنها رح تقرا كتاب عالشط وما رح تعمل ولا إشي. يوم الأحد بالمسا رح نرجع عالبيت.",
   q:{q:"شو رح تعمل لينا بإيلات حسب الرسالة؟", o:["رح تتعلّم غطس","رح تشتغل من الفندق","رح تقرا كتاب عالشط وترتاح"], a:2}},
  {he:"מי רוצה לבוא איתנו? עומר, אמרת שבשבוע הבא גם אתה תהיה בחופש. דנה, אולי גם את תבואי? אם כן, ניפגש ביום חמישי בשש בבוקר ליד הבית שלנו בחיפה. תכתבו לי עד מחר בערב!\nסאמי",
   ar:"مين بدّه ييجي معنا؟ عمر، قلت إنه الأسبوع الجاي إنت كمان رح تكون بعطلة. دانا، يمكن إنتِ كمان تيجي؟ إذا آه، رح نتقابل يوم الخميس الساعة ستة الصبح جنب بيتنا بحيفا. اكتبولي لبكرا بالمسا!\nسامي",
   q:{q:"وين وإمتى رح يتقابلوا؟", o:["يوم الخميس الساعة ستة الصبح جنب بيت سامي","يوم الجمعة بإيلات","بكرا بالمسا بتل أبيب","يوم الخميس الضهر بالمحطة"], a:0}}],

{id:"2-4", title:"שולחן לשבת בערב", ar:"طاولة لمسا السبت", kind:"حوار", nq:false,
 segs:[
  {he:"דנה: מסעדת ״הים הכחול״ בעכו, שלום.\nלינה: שלום, אני רוצה להזמין שולחן לשבת בערב.\nדנה: בשמחה. לכמה אנשים?\nלינה: לשישה. אנחנו מזמינים את ההורים של סאמי, בעלי. יש להם יום נישואים.",
   ar:"دانا: مطعم «البحر الأزرق» بعكا، مرحبا.\nلينا: مرحبا، بدّي أحجز طاولة لمسا السبت.\nدانا: بكل سرور. لكم شخص؟\nلينا: لستة. إحنا عازمين أهل سامي، جوزي. عندهم عيد زواج.",
   q:{q:"ليش لينا حاجزة الطاولة؟", o:["لعيد ميلاد سامي","لعيد زواج أهل سامي","لاجتماع شغل"], a:1}},
  {he:"דנה: ובאיזו שעה תגיעו?\nלינה: אולי בשמונה, אבל אני עוד לא יודעת. אפשר להחליט מחר?\nדנה: אין בעיה, רק תחליטי עד מחר בצהריים.\nלינה: בסדר. ועוד שאלה: אני לא מבינה את התפריט באתר. יש אצלכם דגים?\nדנה: אני אסביר: יש לנו דגים, בשר וגם אוכל צמחוני.",
   ar:"دانا: وأي ساعة رح توصلوا؟\nلينا: يمكن الساعة تمانية، بس لسّا مش عارفة. بنقدر نقرّر بكرا؟\nدانا: ما في مشكلة، بس قرّري لبكرا الضهر.\nلينا: تمام. وكمان سؤال: أنا مش فاهمة المنيو عالموقع. في عندكم سمك؟\nدانا: رح أشرحلك: عنّا سمك ولحمة وكمان أكل نباتي.",
   q:{q:"لإمتى لازم لينا تقرّر الساعة؟", o:["لليوم بالمسا","لبكرا الضهر","ليوم السبت الصبح","لبعد أسبوع"], a:1}},
  {he:"לינה: מצוין, ההורים של סאמי מאוד אוהבים דגים.\nדנה: אז הזמנתי לכם שולחן ליד החלון, בשבת, לשישה אנשים. על שם מי?\nלינה: חדאד, לינה חדאד.\nדנה: תודה, לינה. אני אזכיר לך בהודעה ביום שישי.\nלינה: הבנתי, תודה רבה!",
   ar:"لينا: ممتاز، أهل سامي كتير بيحبّوا السمك.\nدانا: طيب حجزتلكم طاولة جنب الشبّاك، يوم السبت، لستة أشخاص. على اسم مين؟\nلينا: حداد، لينا حداد.\nدانا: شكرًا، لينا. رح أذكّرك برسالة يوم الجمعة.\nلينا: فهمت، شكرًا كتير!",
   q:{q:"وين الطاولة اللي انحجزت؟", o:["عالتراس","جنب الباب","جنب الشبّاك"], a:2}}],
