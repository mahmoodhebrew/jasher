{id:"2-5", title:"מרפאת קופת חולים – מידע למטופלים", ar:"عيادة صندوق المرضى – معلومات للمراجعين", kind:"إعلان", nq:false,
 segs:[
  {he:"מרפאת קופת חולים בנצרת פתוחה מיום ראשון עד יום חמישי, משבע וחצי בבוקר עד שבע בערב. ביום שישי המרפאה פתוחה רק עד שתים עשרה בצהריים. רופא משפחה מקבל רק עם תור. בלי תור אפשר לבוא רק לבדיקת דם.",
   ar:"عيادة صندوق المرضى بالناصرة فاتحة من يوم الأحد ليوم الخميس، من سبعة ونص الصبح لسبعة المسا. يوم الجمعة العيادة فاتحة بس لاتنعش الضهر. دكتور العيلة بيستقبل بس بدور. بلا دور بتقدر تيجي بس لفحص الدم.",
   q:{q:"لإمتى العيادة فاتحة يوم الجمعة؟", o:["لسبعة المسا","لاتنعش الضهر","هي مسكّرة يوم الجمعة","لعشرة الصبح"], a:1}},
  {he:"איך קובעים תור? אפשר לקבוע תור באפליקציה של קופת החולים או בטלפון למוקד. לא יכולים להגיע? צריך לבטל את התור עד יום לפני, כדי שמטופל אחר יקבל אותו. גם ביטול אפשר לעשות באפליקציה, בדקה אחת.",
   ar:"كيف بتحجز دور؟ بتقدر تحجز دور بتطبيق صندوق المرضى أو بالتلفون لمركز الخدمة. ما بتقدر توصل؟ لازم تلغي الدور قبل بيوم، عشان مراجع تاني ياخده. وكمان الإلغاء بتقدر تعمله بالتطبيق، بدقيقة وحدة.",
   q:{q:"ليش لازم تلغي الدور قبل بيوم؟", o:["عشان ما تدفع غرامة","عشان الدكتور يرتاح","عشان مراجع تاني ياخد الدور"], a:2}},
  {he:"בדיקות דם: כל בוקר משבע עד תשע וחצי. חשוב: לבדיקת דם צריך לבוא בצום, כלומר לא לאכול אחרי עשר בלילה. מותר לשתות מים. את התוצאות תקבלו באפליקציה אחרי יומיים או שלושה. עם מרשם מהרופא אפשר ללכת לכל בית מרקחת.",
   ar:"فحوصات الدم: كل صبح من سبعة لتسعة ونص. مهم: لفحص الدم لازم تيجي على الريق، يعني ما توكل بعد عشرة بالليل. مسموح تشرب ميّ. النتائج رح توصلك عالتطبيق بعد يومين أو تلاتة. مع وصفة من الدكتور بتقدر تروح على أي صيدلية.",
   q:{q:"شو مسموح قبل فحص الدم؟", o:["تشرب ميّ","تشرب قهوة","توكل فطور خفيف","توكل لعشرة الصبح"], a:0}}],
 tf:[["العيادة فاتحة يوم السبت",false],["بتقدر تلغي الدور بالتطبيق",true],["نتائج فحص الدم بتوصل بنفس اليوم",false],["لدكتور العيلة لازم تحجز دور",true]],
 find:{q:"إمتى ممنوع توكل قبل فحص الدم؟", a:"חשוב: לבדיקת דם צריך לבוא בצום, כלומר לא לאכול אחרי עשר בלילה."},
 words:[["קופת חולים","كوپات حوليم","صندوق المرضى"],["רופא משפחה","روفيه ميشپاحا","دكتور العيلة"],["לקבוע תור","لِكبوَع تور","يحجز دور"],["לבטל","لِڤَطيل","يلغي"],["בדיקת דם","بديكات دام","فحص دم"],["בצום","بِتسوم","على الريق (صايم)"],["תוצאות","توتسائوت","نتائج"],["בית מרקחת","بيت ميركَحَت","صيدلية"]]
},
{id:"2-6", title:"יום של סידורים", ar:"يوم مشاوير", kind:"إيميل", nq:false,
 segs:[
  {he:"היי מאיה, מה נשמע?\nאתמול היה לי יום של סידורים. בבוקר הלכתי לסניף של הבנק ליד העבודה ופתחתי חשבון בנק חדש. הפקידה ביקשה תעודת זהות, ומילאתי טופס ארוך. בסוף שמתי חתימה בשלושה מקומות!",
   ar:"هاي مايا، شو الأخبار؟\nمبارح كان عندي يوم مشاوير. الصبح رحت على فرع البنك جنب الشغل وفتحت حساب بنك جديد. الموظفة طلبت الهوية، وعبّيت نموذج طويل. بالآخر وقّعت بتلات محلات!",
   q:{q:"شو طلبت الموظفة من لينا؟", o:["كرت ائتمان","الهوية","رسالة من الشغل","معاشها"], a:1}},
  {he:"שאלתי על העמלות. הפקידה הסבירה לי: כל העברה עולה שלושה שקלים, ומשיכה בכספומט של הבנק היא בלי עמלה. אחר כך הפקדתי שלושת אלפים וחמש מאות שקל, וביקשתי כרטיס אשראי. הכרטיס יגיע אליי בדואר בעוד שבוע.",
   ar:"سألت عن العمولات. الموظفة شرحتلي: كل تحويل بكلّف تلات شيكل، والسحب من صراف البنك بلا عمولة. بعدين أودعت تلات آلاف وخمسمية شيكل، وطلبت بطاقة ائتمان. البطاقة رح توصلي بالبريد كمان أسبوع.",
   q:{q:"قديش أودعت لينا بالحساب؟", o:["٣٥٠ شيكل","٣٠٠٠ شيكل","٣٥٠٠ شيكل","٥٣٠٠ شيكل"], a:2}},
  {he:"משם הלכתי לדואר, כי חיכתה לי חבילה מחו״ל: נעליים שקניתי באינטרנט. התור היה ארוך מאוד, וחיכיתי ארבעים דקות! אבל הפקיד בדואר היה מאוד נחמד. בדואר גם שלחתי מכתב לסבתא שלי בטבריה. מתי ניפגשות? תכתבי לי!\nלינה",
   ar:"من هناك رحت عالبريد، لأنه كان مستنّيني طرد من برّا: كندرة اشتريتها عالإنترنت. الدور كان طويل كتير، واستنّيت أربعين دقيقة! بس الموظف بالبريد كان كتير لطيف. بالبريد كمان بعتت رسالة لستّي بطبريا. إمتى رح نتقابل؟ اكتبيلي!\nلينا",
   q:{q:"شو كان بالطرد؟", o:["كندرة","كتب","أواعي لستّها"], a:0}}],
 tf:[["لينا فتحت حساب بنك بفرع جنب الشغل",true],["السحب من صراف البنك بكلّف تلات شيكل",false],["لينا استلمت بطاقة الائتمان بنفس اليوم",false],["لينا استنّت بالبريد أربعين دقيقة",true],["لينا بعتت رسالة لستّها بطبريا",true]],
 order:["لينا فتحت حساب بنك","سألت عن العمولات","أودعت مصاري بالحساب","راحت عالبريد واستلمت طرد"],
 find:{q:"كم مرّة وقّعت لينا؟", a:"בסוף שמתי חתימה בשלושה מקומות!"},
 words:[["חשבון בנק","حيشبون بانك","حساب بنك"],["סניף","سنيف","فرع"],["טופס","طوفِس","نموذج"],["חתימה","حَتيما","توقيع"],["עמלה","عَمَلا","عمولة"],["הפקדתי","هيپكَدتي","أودعت"],["כרטיס אשראי","كَرطيس أشراي","بطاقة ائتمان"],["חבילה","حَڤيلا","طرد"]]
},
{id:"2-7", title:"שיחה למשרד", ar:"مكالمة للمكتب", kind:"حوار", nq:false,
 segs:[
  {he:"טל: חברת ״אור לבית״, טל מדברת, שלום.\nסאמי: שלום, מדבר סאמי חדאד. אני רוצה לדבר עם יוסי ממחלקת המכירות, בבקשה.\nטל: רגע, בבקשה... סליחה, הקו שלו תפוס. אתה רוצה לחכות?\nסאמי: לא, תודה. אני קצת ממהר.",
   ar:"طال: شركة «نور للبيت»، طال معك، مرحبا.\nسامي: مرحبا، معك سامي حداد. بدّي أحكي مع يوسي من قسم المبيعات، لو سمحتِ.\nطال: لحظة، لو سمحت... آسفة، خطّه مشغول. بدّك تستنّى؟\nسامي: لا، شكرًا. أنا مستعجل شوي.",
   q:{q:"ليش سامي ما قدر يحكي مع يوسي؟", o:["لأن يوسي بعطلة","لأن خط يوسي مشغول","لأن الرقم غلط"], a:1}},
  {he:"טל: אתה רוצה להשאיר הודעה?\nסאמי: כן. אתמול יוסי התקשר אליי בקשר להצעת מחיר, ולא הייתי בבית. אני מבקש שהוא יחזור אליי היום.\nטל: בסדר. מה המספר שלך?\nסאמי: אפס חמש ארבע, שלוש שתיים אחת, שבע שמונה תשע אפס.",
   ar:"طال: بدّك تترك رسالة؟\nسامي: آه. مبارح يوسي اتصل فيّ بخصوص عرض سعر، وما كنت بالبيت. بطلب إنه يرجعلي اليوم.\nطال: تمام. شو رقمك؟\nسامي: صفر خمسة أربعة، تلاتة اتنين واحد، سبعة تمانية تسعة صفر.",
   q:{q:"ليش يوسي اتصل بسامي مبارح؟", o:["بخصوص عرض سعر","بخصوص مقابلة شغل","بخصوص فاتورة متأخرة","عشان يعزمه عالعشا"], a:0}},
  {he:"טל: אני חוזרת על המספר: אפס חמש ארבע, שלוש שתיים אחת, שבע שמונה תשע אפס. נכון?\nסאמי: נכון מאוד.\nטל: אני אשאיר לו את ההודעה. הוא יחזור אליך אחרי הפגישה, בסביבות ארבע.\nסאמי: תודה רבה, יום טוב!\nטל: גם לך, להתראות.",
   ar:"طال: رح أعيد الرقم: صفر خمسة أربعة، تلاتة اتنين واحد، سبعة تمانية تسعة صفر. صح؟\nسامي: صح كتير.\nطال: رح أتركله الرسالة. رح يرجعلك بعد الاجتماع، حوالي الساعة أربعة.\nسامي: شكرًا كتير، نهارك سعيد!\nطال: وإنت كمان، مع السلامة.",
   q:{q:"إمتى رح يوسي يرجع لسامي تقريبًا؟", o:["بكرا الصبح","الساعة أربعة بعد الاجتماع","بعد ساعة","الأسبوع الجاي"], a:1}}],
 tf:[["سامي بدّه يحكي مع يوسي من قسم المبيعات",true],["سامي قرّر يستنّى عالخط",false],["سامي ترك رقم تلفونه",true],["طال ما أعادت الرقم",false]],
 order:["طال ردّت عالتلفون","طلعت خط يوسي مشغول","سامي ترك رسالة ورقمه","طال أعادت الرقم"],
 find:{q:"شو طلب سامي من يوسي بالرسالة؟", a:"אני מבקש שהוא יחזור אליי היום."},
 words:[["להתקשר","لِهِتكاشير","يتصل"],["רגע","ريچَع","لحظة"],["תפוס","تافوس","مشغول"],["להשאיר הודעה","لِهَشئير هوداعا","يترك رسالة"],["לחזור אליך","لاحزور إيليخا","يرجعلك (يتصل فيك)"],["מספר","ميسپار","رقم"],["אפס","إيفِس","صفر"],["אליי","إيلاي","لإلي"]]
},
{id:"2-8", title:"ראיון עבודה", ar:"مقابلة عمل", kind:"مقابلة", nq:false,
 segs:[
  {he:"כרים: שלום לינה, תודה שבאת לראיון. קראתי את קורות החיים שלך. ספרי לי קצת על הניסיון שלך.\nלינה: שלום. עבדתי שלוש שנים בשירות לקוחות בחברת טלפונים בחיפה. דיברתי עם לקוחות כל יום ועזרתי להם עם בעיות.",
   ar:"كريم: مرحبا لينا، شكرًا إنك إجيتي عالمقابلة. قريت سيرتك الذاتية. احكيلي شوي عن خبرتك.\nلينا: مرحبا. اشتغلت تلات سنين بخدمة الزباين بشركة تلفونات بحيفا. حكيت مع زباين كل يوم وساعدتهم بمشاكلهم.",
   q:{q:"وين اشتغلت لينا قبل؟", o:["بمطعم بعكا","بخدمة زباين بشركة تلفونات","ببنك بالناصرة","بمحل أواعي"], a:1}},
  {he:"כרים: ולמה את מחפשת עבודה חדשה?\nלינה: אני רוצה הזדמנות לעבוד במכירות. בשנה שעברה גם למדתי קורס מכירות בערב.\nכרים: יפה. אילו כישורים יש לך?\nלינה: אני מדברת עברית, ערבית ואנגלית, אני אוהבת לעבוד בצוות, ואני לומדת מהר.",
   ar:"كريم: وليش بتدوّري على شغل جديد؟\nلينا: بدّي فرصة أشتغل بالمبيعات. السنة الماضية كمان تعلّمت دورة مبيعات بالمسا.\nكريم: حلو. شو مهاراتك؟\nلينا: بحكي عبري وعربي وإنجليزي، بحب أشتغل مع طاقم، وبتعلّم بسرعة.",
   q:{q:"ليش لينا بتدوّر على شغل جديد؟", o:["لأنها بدها معاش أعلى","لأنها بدها تسكن بتل أبيب","لأنها بدها فرصة تشتغل بالمبيعات"], a:2}},
  {he:"כרים: המשרה היא משרה מלאה, עם משמרות בבוקר ובערב. זה מתאים לך?\nלינה: כן, אין בעיה. ומה לגבי המשכורת?\nכרים: נדבר על זה בפגישה השנייה. אני אתקשר אלייך בשבוע הבא.\nלינה: תודה רבה, אחכה לטלפון!",
   ar:"كريم: الوظيفة دوام كامل، مع ورديات الصبح وبالمسا. هاد بيناسبك؟\nلينا: آه، ما في مشكلة. وشو بالنسبة للمعاش؟\nكريم: رح نحكي عن هاد بالمقابلة التانية. رح أتصل فيكِ الأسبوع الجاي.\nلينا: شكرًا كتير، رح أستنّى التلفون!",
   q:{q:"شو قال كريم عن المعاش؟", o:["رح يحكوا عنه بالمقابلة التانية","المعاش عالي كتير","المعاش مكتوب بالإعلان","ما في معاش بأول شهر"], a:0}}],
 tf:[["لينا اشتغلت خمس سنين بخدمة الزباين",false],["لينا تعلّمت دورة مبيعات",true],["الوظيفة دوام جزئي",false],["كريم رح يتصل بلينا الأسبوع الجاي",true]],
 find:{q:"شو اللغات اللي بتحكيها لينا؟", a:"אני מדברת עברית, ערבית ואנגלית, אני אוהבת לעבוד בצוות, ואני לומדת מהר."},
 words:[["ראיון עבודה","رَأيون عَڤودا","مقابلة عمل"],["קורות חיים","كوروت حاييم","سيرة ذاتية"],["ניסיון","نيسايون","خبرة"],["שירות לקוחות","شيروت لَكوحوت","خدمة زبائن"],["הזדמנות","هيزدَمنوت","فرصة"],["כישורים","كيشوريم","مهارات"],["משרה מלאה","ميسرا مِلئا","دوام كامل"],["משכורת","مَسكوريت","معاش"]]
},
{id:"2-9", title:"מזג האוויר לחג", ar:"الطقس للعيد", kind:"خبر", nq:false,
 segs:[
  {he:"תחזית מזג האוויר לסוף השבוע: החורף בא! מחר יהיה קר יותר מהיום, ויירד גשם בצפון הארץ. בחיפה הגשם יתחיל כבר בלילה. בגליל ובטבריה יהיו עננים ורוח חזקה. בהרים הגבוהים בגליל אולי ירד גם קצת שלג.",
   ar:"نشرة الطقس لآخر الأسبوع: الشتا إجا! بكرا رح يكون أبرد من اليوم، ورح تشتّي بشمال البلاد. بحيفا الشتا رح يبلّش من الليل. بالجليل وبطبريا رح يكون في غيم وهوا قوي. بالجبال العالية بالجليل يمكن كمان تتلّج شوي.",

{id:"2-10", title:"האוטו של סאמי", ar:"سيارة سامي", kind:"قصة", nq:false,
 segs:[
  {he:"אתמול בבוקר האוטו של סאמי לא התחיל. הוא ניסה שלוש פעמים, אבל שום דבר לא קרה. בסוף הוא נסע לעבודה באוטובוס והגיע באיחור של חצי שעה. בצהריים הוא התקשר למוסך של אבי בעכו.",
   ar:"مبارح الصبح سيارة سامي ما اشتغلت. حاول تلات مرات، بس ولا إشي صار. بالآخر راح عالشغل بالباص ووصل متأخر نص ساعة. الضهر اتصل بكراج آڤي بعكا.",
   q:{q:"كيف وصل سامي عالشغل مبارح؟", o:["بالسيارة","بالباص","بالقطار","مشي"], a:1}},
  {he:"״מוסך אבי, שלום.״\n״שלום, מדבר סאמי חדאד. האוטו שלי לא מתחיל. אפשר לקבוע תור?״\n״מחר אני מלא, אבל מחרתיים בשמונה בבוקר יש לי מקום. זה מתאים לך?״\n״כן, מצוין. אני אביא את האוטו בשמונה.״\n״תזכיר לי את המספר שלך?״\nסאמי נתן את המספר, ואבי כתב אותו.",
   ar:"«كراج آڤي، مرحبا.»\n«مرحبا، معك سامي حداد. سيارتي ما بتشتغل. بقدر أحجز دور؟»\n«بكرا أنا مليان، بس بعد بكرا الساعة تمانية الصبح عندي محل. بيناسبك؟»\n«آه، ممتاز. رح أجيب السيارة الساعة تمانية.»\n«بتذكّرني برقمك؟»\nسامي عطاه الرقم، وآڤي كتبه.",
   q:{q:"إمتى الدور بالكراج؟", o:["بكرا الصبح","اليوم الضهر","بعد بكرا الساعة تمانية الصبح"], a:2}},
  {he:"בערב סאמי סיפר הכול ללינה: ״מחרתיים אקח את האוטו למוסך, ומשם אסע לעבודה ברכבת. בערב אבי יתקשר ויגיד לי כמה זה יעלה.״ לינה אמרה: ״ובשבוע הבא אני אלמד אותך לבדוק את המים והשמן באוטו!״ סאמי צחק: ״טוב, אבל רק אחרי שאשלם למוסך.״",
   ar:"بالمسا سامي حكى كل إشي للينا: «بعد بكرا رح آخد السيارة عالكراج، ومن هناك رح أروح عالشغل بالقطار. بالمسا آڤي رح يتصل ويقلّي قديش رح تكلّف.» لينا قالت: «والأسبوع الجاي رح أعلّمك تفحص الميّ والزيت بالسيارة!» سامي ضحك: «طيب، بس بعد ما أدفع للكراج.»",
   q:{q:"كيف رح يروح سامي عالشغل بعد ما ياخد السيارة عالكراج؟", o:["بالقطار","بالباص","مع لينا بالسيارة","مشي"], a:0}}],

   ar:"الخميس، بالمسا\nبكرا نور وعمر رح يتجوزوا بحيفا، وأنا كتير متحمّسة. كل الجمعة وأنا بتحضّر للعرس: اشتريت فستان جديد، رحت عالكوافيرة وتمرّنت عالرقصة مع صاحبات نور. صرلنا تلات جمعات بنتمرّن، وبفكّر إنه الرقصة طلعت كتير حلوة. بس في إشي واحد لسا ما تدبّر: الكندرة.",

  {he:"אני מתלבטת כבר שעה בין נעליים שחורות לנעליים אדומות. השחורות יפות ומתאימות לשמלה, אבל האדומות יותר נוחות, ובחתונה רוקדים הרבה. סאמי אומר שאני תמיד מתלבטת יותר מדי. הוא בכלל לא מתעניין בבגדים, ויש לו חליפה אחת לכל האירועים. הוא אמר לי: ״אני אתלבש חמש דקות לפני שיוצאים, וזהו.״ אני לא מבינה איך הוא מסתדר ככה.",

   q:{q:"מה סאמי אומר על הבגדים שלו?", o:["הוא יקנה בגדים חדשים","הוא מתלבט שעה מה ללבוש","הוא יתלבש חמש דקות לפני שיוצאים"], a:2}},
  {he:"יום שישי, בלילה\nאיזה ערב! בבוקר התקלחתי והתלבשתי לאט, ובכל זאת איחרנו בעשר דקות. התנצלתי בפני נור, אבל היא רק צחקה. כשהיא הגיעה עם עומר, כולם התרגשו, ואני בכיתי קצת. אפילו סאמי התרגש, למרות שהוא אומר שלא. בסוף נעלתי את הנעליים האדומות ורקדתי כל הלילה. עכשיו אני כבר מתגעגעת לערב הזה.",

{id:"3-2", title:"יום שבו הכול נשבר", ar:"يوم كل إشي فيه انكسر", kind:"قصة", nq:false,

  {he:"ביום ראשון בבוקר הכול התחיל רע. סאמי קם מאוחר, ובמטבח הכוס האהובה עליו נפלה ונשברה. הוא אסף את החתיכות מהרצפה, נזהר לא להיפצע, ואחר כך גילה שגם הקפה נגמר. ״לא נורא,״ הוא אמר לעצמו, ״אשתה קפה בעבודה.״",

  {he:"בדרך לעבודה הוא רצה להתקשר ללינה, אבל הסוללה בטלפון כמעט נגמרה. הוא חיפש את המטען בתיק, אבל המטען לא נמצא שם. הוא נשאר בבית, על השולחן במטבח, ליד הכוס השבורה. בצהריים סאמי החליט ללכת לחנות טלפונים קרובה ולקנות מטען חדש.",

   ar:"وصل عالمحل الساعة ستة إلا خمسة. عالباب كان في يافطة: «المحل بيفتح الساعة تسعة وبيسكّر الساعة ستة.» سامي فات بسرعة. البيّاع ابتسم وقال: «ضايلّك خمس دقايق، بس عشانك مش مستعجل.» سامي اشترى شاحن، انتبه ما يوقّعه، وطلع من المحل مبسوط.",

{id:"3-3", title:"ברוכה הבאה לשכונה", ar:"أهلا فيكي بالحارة", kind:"رسالة", nq:false,
 segs:[
  {he:"היי דנה, ברוכה הבאה לשכונה! הבטחתי לכתוב לך איפה הכול נמצא, אז הנה. תחנת האוטובוס קרובה מאוד: יוצאים מהבניין, הולכים ימינה, והיא בפינה. משם יש אוטובוס למרכז העיר כל רבע שעה. אם את צריכה כרטיס, אפשר לקנות אותו באפליקציה.",
   ar:"هاي دانا، أهلا فيكي بالحارة! وعدتك أكتبلك وين كل إشي، فهيك. محطة الباص كتير قريبة: بتطلعي من العمارة، بتمشي يمين، وهي عالزاوية. من هناك في باص لوسط البلد كل ربع ساعة. إذا بدك تذكرة، فيكي تشتريها بالتطبيق.",
   q:{q:"איפה תחנת האוטובוס?", o:["מול בית הספר","בפינה, ימינה מהבניין","ליד הגינה"], a:1}},
  {he:"מול התחנה יש מכולת קטנה. בעל המכולת, יוסי, מאוד נחמד, ויש לו שמן זית מצוין מהגליל. ליד המכולת יש בית קפה שקט. אני הולכת לשם כל בוקר לפני העבודה, ועוגת השוקולד שלהם פשוט חלום.",
   ar:"مقابل المحطة في دكانة صغيرة. صاحب الدكانة، يوسي، كتير لطيف، وعنده زيت زيتون ممتاز من الجليل. جنب الدكانة في مقهى هادي. أنا بروح عليه كل يوم الصبح قبل الشغل، وكعكة الشوكولاتة عندهم حلم.",
   q:{q:"מה מיוחד בבית הקפה, לפי לינה?", o:["עוגת השוקולד","שמן הזית","המחירים הזולים"], a:0}},
  {he:"בית הספר של השכונה נמצא ברחוב הבא, ליד הגינה. בגינה יש ספסלים ומגרש קטן, והילדים משחקים שם כל אחר הצהריים. ועוד דבר: בקומת המרתף יש חדר כביסה עם מכונת כביסה לכל הדיירים. כדאי לכתוב את השם שלך על הלוח לפני שמשתמשים בה.",
   ar:"مدرسة الحارة بالشارع اللي بعده، جنب الجنينة. بالجنينة في مقاعد وملعب صغير، والولاد بيلعبوا هناك كل يوم بعد الضهر. وكمان إشي: بطابق التسوية في غرفة غسيل فيها غسالة لكل السكان. أحسن تكتبي اسمك عاللوح قبل ما تستعمليها.",
   q:{q:"איפה מכונת הכביסה של הבניין?", o:["בדירה של לינה","במכולת","בקומת המרתף"], a:2}},
  {he:"ובשבוע הבא, ביום שישי, יש לי יום הולדת. אנחנו עושים ארוחת ערב קטנה בבית, עם כמה שכנים וחברים, ואת מוזמנת! הדירה שלנו בקומה השנייה, הדלת הכחולה. תביאי רק מצב רוח טוב. אם יש שאלות, תמיד אפשר לדפוק לי בדלת.\nנשיקות, לינה",
   ar:"والأسبوع الجاي، يوم الجمعة، عيد ميلادي. عاملين عشا صغير بالبيت، مع كم جار وصاحب، وإنتِ معزومة! شقتنا بالطابق التاني، الباب الأزرق. جيبي معك بس مزاج منيح. إذا عندك أسئلة، دايمًا فيكي تدقّي عليّ الباب.\nبوسات، لينا",
   q:{q:"לאן לינה מזמינה את דנה?", o:["לבית הספר","לבית הקפה","לארוחת ערב ביום ההולדת שלה"], a:2}}],
 tf:[["האוטובוס למרכז העיר יוצא כל רבע שעה", true],["לבעל המכולת קוראים עומר", false],["בית הספר נמצא ליד הגינה", true],["לינה מבקשת מדנה להביא עוגה", false]],
 find:{q:"מה אפשר לקנות אצל יוסי במכולת?", a:"בעל המכולת, יוסי, מאוד נחמד, ויש לו שמן זית מצוין מהגליל."},
 words:[["שְׁכוּנָה","شخونا","حارة"],["תַּחֲנַת אוֹטוֹבּוּס","تَحَنات أوطوبوس","محطة باص"],["פִּינָה","پينا","زاوية"],["מַכֹּלֶת","مَكوليت","دكان، بقالة"],["שֶׁמֶן זַיִת","شيمِن زايِت","زيت زيتون"],["עוּגַת שׁוֹקוֹלָד","عوچات شوكولاد","كعكة شوكولاتة"],["מְכוֹנַת כְּבִיסָה","مِخونات كڤيسا","غسالة"],["יוֹם הוּלֶדֶת","يوم هوليدِت","عيد ميلاد"]]
},
{id:"3-4", title:"מכתב מביטוח לאומי", ar:"رسالة من التأمين الوطني", kind:"رسالة رسمية", nq:false,
 segs:[
  {he:"ביטוח לאומי – סניף חיפה\nלכבוד\nמר סאמי חדאד\nרחוב הגפן 12, חיפה\nהנדון: בקשה לקצבת ילדים\nמר חדאד שלום רב,\nקיבלנו את הבקשה לקצבת ילדים ששלחת אלינו בתאריך 3.9. אנחנו מודים לך על הפנייה, ומאחלים מזל טוב להולדת הבת.",
   ar:"التأمين الوطني – فرع حيفا\nإلى حضرة\nالسيد سامي حداد\nشارع هچيفن 12، حيفا\nالموضوع: طلب مخصّص أولاد\nسيد حداد، تحية طيبة،\nوصلنا طلب مخصّص الأولاد اللي بعتتلنا ياه بتاريخ 3.9. منشكرك على توجّهك، ومنتمنالك مبروك عولادة البنت.",
   q:{q:"על מה המכתב?", o:["על חשבון חשמל","על בקשה לקצבת ילדים","על חוזה דירה"], a:1}},
  {he:"כדי לבדוק את הזכאות שלך, אנחנו צריכים עוד כמה מסמכים. יש לצרף לבקשה את המסמכים הבאים:\n1. צילום של תעודות הזהות של שני ההורים.\n2. אישור מהבנק על מספר החשבון.\n3. צילום של תעודת הלידה של הילדה.\nחשוב: אין צורך לשלוח מסמכים מקוריים. מספיק לשלוח צילום ברור של כל מסמך.",
   ar:"عشان نفحص استحقاقك، محتاجين كمان كم مستند. لازم ترفق مع الطلب المستندات هاي:\n1. نسخة عن هويات الأهل التنين.\n2. تصديق من البنك على رقم الحساب.\n3. نسخة عن شهادة ميلاد البنت.\nمهم: ما في داعي تبعت مستندات أصلية. بيكفي تبعت نسخة واضحة عن كل مستند.",
   q:{q:"כמה מסמכים צריך לצרף?", o:["שניים","ארבעה","שלושה"], a:2}},
  {he:"את המסמכים אפשר להגיש בסניף, בדואר או באתר של ביטוח לאומי. המועד האחרון להגשת המסמכים הוא 30.10. אם המסמכים לא יגיעו עד המועד האחרון, הבקשה תיסגר, ותצטרך להגיש בקשה חדשה מההתחלה, עם כל המסמכים. אחרי שנאשר את הבקשה, הקצבה תגיע לחשבון הבנק שלך בכל חודש.",
   ar:"المستندات بتقدر تقدّمها بالفرع، بالبريد أو بموقع التأمين الوطني. آخر موعد لتقديم المستندات هو 30.10. إذا المستندات ما وصلت لآخر موعد، الطلب رح يتسكّر، ورح تضطر تقدّم طلب جديد من الأول، مع كل المستندات. بعد ما نوافق عالطلب، المخصّص رح يوصل لحسابك بالبنك كل شهر.",
   q:{q:"מה יקרה אם המסמכים לא יגיעו בזמן?", o:["הבקשה תיסגר","הקצבה תהיה גדולה יותר","סאמי יקבל פיצוי"], a:0}},
  {he:"לשאלות אפשר להתקשר למוקד הטלפוני בימים א׳–ה׳, בין השעות 8:00 ל-17:00. אפשר גם לקבוע תור בסניף דרך האתר, ולהימנע מהמתנה ארוכה.\nבברכה,\nטל, מחלקת קצבאות",
   ar:"للأسئلة بتقدر تتصل عالمركز الهاتفي من الأحد للخميس، بين الساعة 8:00 و-17:00. وفيك كمان تحجز دور بالفرع عن طريق الموقع، وتتجنّب الانتظار الطويل.\nمع التحية،\nطال، قسم المخصّصات",
   q:{q:"מתי אפשר להתקשר למוקד?", o:["רק ביום שישי","בימים א׳–ה׳, מ-8:00 עד 17:00","כל יום בלילה"], a:1}}],
 tf:[["סאמי שלח את הבקשה ב-3.9", true],["אפשר להגיש את המסמכים רק בסניף", false],["המועד האחרון הוא 30.10", true],["הקצבה תגיע פעם בשנה", false]],
 find:{q:"מה המועד האחרון להגשת המסמכים?", a:"המועד האחרון להגשת המסמכים הוא 30.10."},
 words:[["בִּיטּוּחַ לְאוּמִּי","بيطواح لِئومي","التأمين الوطني"],["לִכְבוֹד","لِخڤود","إلى حضرة"],["הַנִּדּוֹן","هانيدون","الموضوع"],["מִסְמָךְ","ميسماخ","مستند"],["לְצָרֵף","لِتسَريف","يرفق"],["מוֹעֵד אַחֲרוֹן","موعيد أحَرون","آخر موعد"],["זַכָּאוּת","زَكائوت","استحقاق"],["קִצְבָּה","كِتسڤا","مخصّص"]]
},
{id:"3-5", title:"עלייה במחירי הדלק", ar:"ارتفاع بأسعار الوقود", kind:"خبر", nq:false,
 segs:[
  {he:"עלייה במחירי הדלק גם החודש\nמחיר הדלק עלה הלילה ב-20 אגורות לליטר, ולכן נהגים רבים מילאו את המכונית כבר אתמול בערב. זאת העלייה השלישית ברציפות. לפי כתבה בעיתון, המחיר עלה בגלל העלייה במחירי הנפט בעולם. ליטר בנזין עולה עכשיו יותר משבעה שקלים.",
   ar:"ارتفاع بأسعار الوقود كمان هالشهر\nسعر البنزين طلع الليلة 20 أغورا عاللتر، عشان هيك سواقين كتير عبّوا السيارة من مبارح بالمسا. هاد تالت ارتفاع ورا بعض. حسب تقرير بالجريدة، السعر طلع بسبب ارتفاع أسعار النفط بالعالم. لتر البنزين هلأ بأكتر من سبع شواكل.",
   q:{q:"למה המחיר עלה?", o:["בגלל הבחירות","בגלל העלייה במחירי הנפט בעולם","כי יש פחות נהגים"], a:1}},
  {he:"בתחנת דלק בחיפה פגשנו את כרים, נהג מונית. ״אני נוסע כל יום מחיפה לתל אביב,״ הוא סיפר, ״לכן אני מרגיש כל שקל בכיס. למרות זה, אני לא יכול להפסיק לעבוד.״ כרים מספר שהוא כבר העלה קצת את המחיר של הנסיעות, אבל לא כל הלקוחות מרוצים.",
   ar:"بمحطة بنزين بحيفا التقينا بكريم، سوّاق تاكسي. «أنا بسافر كل يوم من حيفا لتل أبيب،» حكى، «عشان هيك بحس بكل شيكل بجيبتي. رغم هيك، ما بقدر أوقّف شغل.» كريم بيحكي إنه صار يرفع شوي سعر المشاوير، بس مش كل الزباين مبسوطين.",
   q:{q:"מה העבודה של כרים?", o:["סטודנט","עיתונאי","נהג מונית"], a:2}},
  {he:"לעומת זאת, מחירי הרכבת והאוטובוסים לא עלו, ויותר אנשים מתחילים להשתמש בתחבורה ציבורית. בנוסף, הממשלה הודיעה שמהחודש הבא יהיו יותר רכבות בין חיפה לבאר שבע. דנה, סטודנטית מעכו, אמרה: ״אני כבר לא נוסעת באוטו, כי הרכבת זולה יותר ונוחה.״",
   ar:"بالمقابل، أسعار القطار والباصات ما طلعت، وناس أكتر صاروا يستعملوا المواصلات العامة. بالإضافة، الحكومة أعلنت إنه من الشهر الجاي رح يكون في قطارات أكتر بين حيفا وبئر السبع. دانا، طالبة من عكا، قالت: «أنا ما عدت أسافر بالسيارة، لأنه القطار أرخص ومريح.»",
   q:{q:"למה דנה נוסעת ברכבת?", o:["כי הרכבת זולה ונוחה","כי אין לה רישיון","כי היא גרה ליד התחנה"], a:0}},
  {he:"מומחים אומרים שבחודש הבא אולי תהיה ירידה קטנה במחיר, אבל זה לא בטוח. בינתיים, כדאי לבדוק את המחירים בתחנות השונות לפני שממלאים, כי ההבדל יכול להגיע לעשרות שקלים בחודש.",
   ar:"خبراء بيقولوا إنه الشهر الجاي يمكن يصير هبوط صغير بالسعر، بس هاد مش أكيد. لهلأ، أحسن تفحصوا الأسعار بالمحطات المختلفة قبل ما تعبّوا، لأنه الفرق ممكن يوصل لعشرات الشواكل بالشهر.",
   q:{q:"מה אומרים המומחים?", o:["המחיר יעלה שוב בטוח","הרכבות יהיו יקרות יותר","אולי תהיה ירידה קטנה בחודש הבא"], a:2}}],
 tf:[["מחיר הדלק עלה ב-20 אגורות לליטר", true],["זאת העלייה הראשונה במחיר", false],["גם מחירי הרכבת עלו", false],["יהיו יותר רכבות בין חיפה לבאר שבע", true]],
 find:{q:"מה כרים אומר על העבודה שלו, למרות המחירים?", a:"למרות זה, אני לא יכול להפסיק לעבוד."},
 words:[["עֲלִיָּיה","عَلِيّا","ارتفاع"],["יְרִידָה","يِريدا","هبوط"],["דֶּלֶק","ديليك","بنزين، وقود"],["כַּתָּבָה","كَتاڤا","تقرير، مقال"],["לָכֵן","لاخين","عشان هيك"],["לַמְרוֹת","لَمروت","رغم"],["בְּנוֹסָף","بِنوساف","بالإضافة"],["לְעוּמַּת זֹאת","لِعومات زوت","بالمقابل"]]
},
{id:"3-6", title:"ארוחת ערב בלי טלפונים", ar:"عشا بلا تلفونات", kind:"مقال رأي", nq:false,
 segs:[
  {he:"ארוחת ערב בלי טלפונים? אני בעד!\nמאת: עומר\nלפני חודש עשינו בבית שלנו ניסוי: בזמן ארוחת הערב כל הטלפונים נשארים בסלון. בהתחלה הילדים כעסו, ואני מודה שגם לי היה קשה. אבל אחרי שבוע משהו השתנה.",
   ar:"عشا بلا تلفونات؟ أنا مع!\nبقلم: عمر\nقبل شهر عملنا ببيتنا تجربة: وقت العشا كل التلفونات بتضل بالصالون. بالأول الولاد زعلوا، وأنا بعترف إنه كمان أنا صعبت عليّ. بس بعد جمعة في إشي تغيّر.",
   q:{q:"איפה נשארים הטלפונים בזמן ארוחת הערב אצל עומר?", o:["במטבח","בסלון","בחדר השינה"], a:1}},
  {he:"לדעתי, היתרון הכי גדול הוא שאנחנו באמת מדברים. הילדים מספרים על בית הספר, ואנחנו צוחקים יחד. מצד אחד, אנחנו פחות זמינים לעבודה ולחברים. מצד שני, אין הודעה כל כך חשובה שלא יכולה לחכות חצי שעה. נראה לי שכדאי לכל משפחה לנסות.",
   ar:"برأيي، أكبر ميزة إنه إحنا عنجد بنحكي. الولاد بيحكوا عن المدرسة، وإحنا بنضحك سوا. من جهة، إحنا أقل متاحين للشغل وللأصحاب. من جهة تانية، ما في رسالة مهمة لدرجة إنها ما بتقدر تستنى نص ساعة. بيبيّنلي إنه بيستاهل كل عيلة تجرّب.",
   q:{q:"מה היתרון הכי גדול, לדעת עומר?", o:["הם אוכלים מהר יותר","הילדים לומדים יותר","הם באמת מדברים"], a:2}},
  {he:"תגובה של מאיה מנצרת:\nאני מסכימה עם עומר שחשוב לדבר בזמן האוכל, אבל אני לא בטוחה שהכלל הזה מתאים לכולם. אני מנהלת חנות, ולפעמים העובדים מתקשרים אליי בדיוק בשעת הארוחה. מה אז? לדעתי עדיף לשים את הטלפון על שקט, ולא להעביר אותו לחדר אחר.",
   ar:"تعليق من مايا من الناصرة:\nأنا موافقة مع عمر إنه مهم نحكي وقت الأكل، بس مش متأكدة إنه هالقاعدة بتناسب الكل. أنا بدير محل، وأحيانًا الموظفين بيتصلوا فيّ بالزبط وقت الأكل. شو بعمل ساعتها؟ برأيي أحسن نحط التلفون عالصامت، وما ننقله لغرفة تانية.",
   q:{q:"מה מאיה מציעה?", o:["לשים את הטלפון על שקט","לאכול בלי לדבר","לכבות את הטלפון כל היום"], a:0}},
  {he:"תגובה של רון מתל אביב:\nאני מסכים לגמרי עם עומר! אצלנו בבית יש ויכוח כל ערב בגלל הטלפונים. מחר אני מציע את הרעיון לאשתי. אם זה עובד אצלכם, למה שזה לא יעבוד אצלנו?",

{id:"3-7", title:"טעות בחשבונית", ar:"غلط بالفاتورة", kind:"إيميل", nq:false,
 segs:[
  {he:"אל: שירות לקוחות, חברת ״גלנט״\nמאת: לינה חדאד, מספר לקוח 48213\nהנדון: טעות בחשבונית לחודש ספטמבר\nשלום רב,\nאני לקוחה שלכם כבר חמש שנים, ותמיד הייתי מרוצה מהשירות. לצערי, החודש אני נאלצת להתלונן על שתי בעיות.",
   ar:"إلى: خدمة الزبائن، شركة «چلنِت»\nمن: لينا حداد، رقم زبون 48213\nالموضوع: غلط بفاتورة شهر أيلول\nتحية طيبة،\nأنا زبونة عندكم من خمس سنين، ودايمًا كنت مبسوطة من الخدمة. للأسف، هالشهر مضطرة أشتكي على مشكلتين.",
   q:{q:"כמה זמן לינה לקוחה של החברה?", o:["שנה אחת","חמש שנים","עשר שנים"], a:1}},
  {he:"בחשבונית האחרונה מופיע חיוב של 240 שקל, אבל המנוי שלי עולה 120 שקל בחודש. נראה לי שחייבתם אותי פעמיים. בנוסף, בשבוע שעבר הייתה תקלה באינטרנט במשך שלושה ימים. התקשרתי שלוש פעמים, והטכנאי הגיע רק ביום הרביעי. הוא תיקן את התקלה תוך עשר דקות, ואמר שהבעיה הייתה בכבל ברחוב.",
   ar:"بالفاتورة الأخيرة في خصم 240 شيكل، بس اشتراكي حقه 120 شيكل بالشهر. بيبيّنلي إنكم خصمتوا مني مرتين. بالإضافة، الجمعة الماضية كان في عطل بالإنترنت لمدة تلات أيام. اتصلت تلات مرات، والفني إجا بس باليوم الرابع. صلّح العطل خلال عشر دقايق، وقال إنه المشكلة كانت بالكابل بالشارع.",
   q:{q:"כמה עולה המנוי של לינה בחודש?", o:["240 שקל","48 שקל","120 שקל"], a:2}},
  {he:"אני מבינה שטעויות קורות, אבל שלושה ימים בלי אינטרנט זה לא מקובל, במיוחד כשאני עובדת מהבית. לכן אני מבקשת שני דברים: החזר של 120 שקל על החיוב הכפול, וזיכוי או פיצוי על הימים בלי שירות. אני חושבת שזו בקשה הוגנת.",
   ar:"أنا فاهمة إنه الأغلاط بتصير، بس تلات أيام بلا إنترنت هاد مش مقبول، خصوصًا إني بشتغل من البيت. عشان هيك بطلب شغلتين: ترجيع 120 شيكل عالخصم المزدوج، ورصيد مرتجع أو تعويض عالأيام اللي بلا خدمة. بفكّر إنه هاد طلب عادل.",
   q:{q:"מה לינה מבקשת מהחברה?", o:["טכנאי חדש","מנוי זול יותר","החזר וזיכוי או פיצוי"], a:2}},
  {he:"מצורף צילום של החשבונית. אשמח לקבל תשובה עד סוף השבוע, במייל או בטלפון. אני זמינה בכל יום אחרי ארבע. אם לא אקבל תשובה, אצטרך לחשוב על מעבר לחברה אחרת.\nתודה מראש,\nבברכה,\nלינה חדאד",
   ar:"مرفقة نسخة عن الفاتورة. بكون مبسوطة إذا وصلني رد لآخر الجمعة، بالإيميل أو بالتلفون. أنا متاحة كل يوم بعد الأربعة. إذا ما وصلني رد، رح أضطر أفكّر أنقل لشركة تانية.\nشكرًا سلفًا،\nمع التحية،\nلينا حداد",
   q:{q:"מה לינה צירפה למייל?", o:["צילום של החשבונית","את החוזה","תמונה של הטכנאי"], a:0}}],
 tf:[["לפני החודש הזה לינה הייתה מרוצה מהשירות", true],["הטכנאי הגיע באותו יום", false],["לינה עובדת מהבית", true],["לינה כבר עברה לחברה אחרת", false]],
 find:{q:"מה הבעיה בחשבונית?", a:"בחשבונית האחרונה מופיע חיוב של 240 שקל, אבל המנוי שלי עולה 120 שקל בחודש."},
 words:[["לְהִתְלוֹנֵן","لِهِتلونين","يشتكي"],["חֶשְׁבּוֹנִית","حِشبونيت","فاتورة"],["חִיּוּב","حيوڤ","خصم، تحصيل"],["מָנוּי","مِنوي","اشتراك"],["תַּקָּלָה","تَكالا","عطل"],["טֶכְנַאי","طِخناي","فني"],["הֶחְזֵר","هيحزير","استرجاع مصاري"],["לֹא מְקוּבָּל","لو مِكوبال","مش مقبول"]]
},
{id:"3-8", title:"חוזה שכירות בעכו", ar:"عقد إيجار بعكا", kind:"عقد", nq:false,
 segs:[
  {he:"חוזה שכירות – דירת שלושה חדרים, רחוב הים 7, עכו\nהחוזה נחתם בין המשכירה, מאיה ר., לבין השוכרים, סאמי ולינה חדאד.\nסעיף 1: תקופת השכירות היא שנה אחת, מ-1.11 עד 31.10. לשוכרים יש אפשרות להאריך את החוזה בשנה נוספת, אם יודיעו על כך למשכירה חודשיים לפני סוף התקופה.",
   ar:"عقد إيجار – شقة تلات غرف، شارع هيام 7، عكا\nالعقد انوقّع بين المؤجّرة، مايا ر.، والمستأجرين، سامي ولينا حداد.\nبند 1: فترة الإيجار سنة وحدة، من 1.11 لـ 31.10. المستأجرين إلهم إمكانية يمدّدوا العقد سنة كمان، إذا بلّغوا المؤجّرة قبل آخر الفترة بشهرين.",
   q:{q:"לכמה זמן החוזה?", o:["לחצי שנה","לשנה אחת","לשנתיים"], a:1}},
  {he:"סעיף 2: שכר הדירה הוא 4,200 שקל לחודש. השוכרים ישלמו את שכר הדירה עד ה-5 בכל חודש.\nסעיף 3: ארנונה, חשמל, מים והתשלום לוועד הבית לא כלולים בשכר הדירה, והשוכרים ישלמו אותם בעצמם.",
   ar:"بند 2: أجرة الشقة 4,200 شيكل بالشهر. المستأجرين رح يدفعوا الأجرة لغاية 5 بكل شهر.\nبند 3: الأرنونا، الكهربا، المي ودفعة لجنة العمارة مش مشمولين بالأجرة، والمستأجرين بيدفعوهم لحالهم.",
   q:{q:"מה לא כלול בשכר הדירה?", o:["ארנונה, חשמל, מים וועד בית","רק החשמל","הכול כלול"], a:0}},
  {he:"סעיף 4: בתחילת התקופה השוכרים ייתנו פיקדון של 8,000 שקל. המשכירה תחזיר את הפיקדון בסוף התקופה, אם הדירה תהיה במצב טוב.\nסעיף 5: תיקונים קטנים, כמו נורה או ברז, הם באחריות השוכרים. תיקונים גדולים, כמו דוד שמש או מזגן, הם באחריות המשכירה.",
   ar:"بند 4: ببداية الفترة المستأجرين بيعطوا عربون (تأمين) 8,000 شيكل. المؤجّرة بترجّع العربون بآخر الفترة، إذا الشقة بتكون بحالة منيحة.\nبند 5: التصليحات الزغيرة، زي لمبة أو حنفية، على مسؤولية المستأجرين. التصليحات الكبيرة، زي سخان شمسي أو مكيّف، على مسؤولية المؤجّرة.",
   q:{q:"מי אחראי לתקן מזגן?", o:["השוכרים","ועד הבית","המשכירה"], a:2}},
  {he:"סעיף 6: שוכר שרוצה לפנות את הדירה לפני סוף התקופה צריך לתת הודעה מוקדמת של 60 יום, או למצוא שוכר אחר במקומו.\nהערה של סאמי בעיפרון, בצד הדף: ״לינה, לשאול את מאיה אם מותר לגדל חתול! זה לא כתוב בשום סעיף.״",
   ar:"بند 6: المستأجر اللي بدّه يخلي الشقة قبل آخر الفترة لازم يعطي إشعار مسبق 60 يوم، أو يلاقي مستأجر تاني بداله.\nملاحظة من سامي بقلم الرصاص، عطرف الورقة: «لينا، لازم نسأل مايا إذا مسموح نربّي بسّة! هاد مش مكتوب بولا بند.»",
   q:{q:"מה סאמי רוצה לשאול את מאיה?", o:["אם אפשר לשלם פחות","אם מותר לגדל חתול","אם יש חניה"], a:1}}],

 words:[["חוֹזֶה","حوزيه","عقد"],["שׂוֹכֵר","سوخير","مستأجر"],["מַשְׂכִּיר","مَسكير","مؤجّر"],["שְׂכַר דִּירָה","سخار ديرا","أجرة الشقة"],["פִּיקָּדוֹן","پيكادون","عربون، تأمين"],["סְעִיף","سعيف","بند"],["לְהַאֲרִיךְ","لِهَأريخ","يمدّد"],["הוֹדָעָה מוּקְדֶּמֶת","هوداعا موكدِمِت","إشعار مسبق"]]

{id:"3-9", title:"יאללה, נתראה בנמל", ar:"يلا، منشوفك بالميناء", kind:"محادثة واتساب", nq:false,
 segs:[
  {he:"עומר: אהלן אחי, מה קורה?\nסאמי: אהלן! סבבה, ואצלך?\nעומר: אחלה. תקשיב, בא לך לצאת הערב? יש הופעה בנמל של חיפה.\nסאמי: וואלה? איזו הופעה?\nעומר: להקה של חבר שלי. אומרים שהם חבל על הזמן.",
   ar:"عمر: أهلين خيّا، شو في؟\nسامي: أهلين! تمام، وإنت؟\nعمر: ممتاز. اسمع، جاي عبالك تطلع الليلة؟ في حفلة بميناء حيفا.\nسامي: عنجد؟ أي حفلة؟\nعمر: فرقة لصاحبي. بيقولوا إنهم خرافيين.",
   q:{q:"לאן עומר מזמין את סאמי?", o:["לסרט","להופעה בנמל","לארוחת ערב"], a:1}},
  {he:"סאמי: נשמע כיף, אבל תכל׳ס אני גמור מהעבודה. וגם לינה רצתה שנראה סרט בבית.\nעומר: נו באמת! סתם, אני מבין. אבל תביא את לינה, דווקא היא תאהב את ההופעה. היא אוהבת מוזיקה כזאת, ראיתי אותה רוקדת בחתונה של נור.\nסאמי: האמת שאתה צודק. רגע, אני שואל אותה ואחזור אליך.",
   ar:"سامي: بتبيّن حلوة، بس بالآخر أنا هلكان من الشغل. وكمان لينا كان بدها نحضر فيلم بالبيت.\nعمر: يا زلمة! بمزح، فاهم عليك. بس جيب لينا، بالعكس هي رح تحب الحفلة. بتحب هيك موسيقى، شفتها بترقص بعرس نور.\nسامي: الصراحة معك حق. لحظة، بسألها وبرجعلك.",
   q:{q:"למה סאמי לא בטוח בהתחלה?", o:["אין לו כסף","הוא עייף מהעבודה","הוא לא אוהב מוזיקה"], a:1}},
  {he:"סאמי: לינה אומרת שבא לה! מתי זה מתחיל?\nעומר: בתשע. אני אאסוף אתכם בשמונה וחצי, בסדר?\nסאמי: בקטנה, אנחנו יכולים לבוא באוטובוס.\nעומר: מה פתאום אוטובוס? אני עובר לידכם בכל מקרה.\nסאמי: סבבה, תודה אחי. אז יאללה, נתראה בשמונה וחצי.\nעומר: חלאס, סגרנו. אתה תראה, תהיה מבסוט!",
   ar:"سامي: لينا بتقول إنها جاي عبالها! إيمتى بتبلّش؟\nعمر: الساعة تسعة. بمرق آخدكم تمانية ونص، ماشي؟\nسامي: ولا يهمك، فينا نيجي بالباص.\nعمر: شو باص؟ أنا مارق من جنبكم على كل حال.\nسامي: تمام، شكرًا خيّا. يلا، منشوفك تمانية ونص.\nعمر: خلص، اتفقنا. رح تشوف، رح تنبسط!",
   q:{q:"איך סאמי ולינה מגיעים להופעה?", o:["באוטובוס","ברגל","עומר אוסף אותם"], a:2}},
  {he:"(למחרת בבוקר)\nסאמי: וואלה, צדקת. איזה ערב! לינה עדיין שרה את השירים.\nעומר: אמרתי לך! בפעם הבאה אתם מזמינים אותי לסרט.",
   ar:"(تاني يوم الصبح)\nسامي: والله، كان معك حق. شو هالسهرة! لينا لسا بتغنّي الأغاني.\nعمر: قلتلك! المرة الجاي إنتو بتعزموني عالفيلم.",
   q:{q:"מה לינה עושה בבוקר שאחרי?", o:["רואה סרט","עדיין שרה את השירים","ישנה עד הצהריים"], a:1}}],

{id:"3-10", title:"אסיפת דיירים: הגג דולף", ar:"اجتماع سكان: السطح بيدلف", kind:"محضر اجتماع", nq:false,
 segs:[
  {he:"פרוטוקול – אסיפת דיירים, רחוב הזית 15, נצרת\nביום שני בערב נפגשו הדיירים בלובי של הבניין. אבי, יושב ראש ועד הבית, פתח את האסיפה.\nאבי: ערב טוב לכולם. נפגשנו בגלל הבעיה בגג. מאז הגשם בשבוע שעבר יש נזילה בדירה של ראנייה בקומה הרביעית.",

{id:"4-3", title:"פרוטוקול ישיבת צוות", ar:"محضر اجتماع فريق", kind:"محضر اجتماع", nq:false,
 segs:[
  {he:"פרוטוקול ישיבת צוות — מחלקת משלוחים, נצרת\nיום שלישי, 10:00\nמשתתפים: דנה (מנהלת המחלקה), סאמי, כרים, מאיה, טל\nסדר היום:\n1. עיכובים במשלוחים לאזור הגליל\n2. תקציב לרכב חלוקה נוסף\n3. מסיבת סוף השנה\nדנה פתחה את הישיבה והודתה לכולם שהגיעו בזמן. היא הזכירה שבחודש האחרון היו הרבה תלונות מלקוחות בגליל על משלוחים שהגיעו באיחור. לדבריה, המטרה היא לפתור את הבעיה עוד לפני סוף החודש.",
   ar:"محضر اجتماع فريق — قسم الإرساليات، الناصرة\nيوم التلاتا، 10:00\nالمشاركين: دانا (مديرة القسم)، سامي، كريم، مايا، طال\nجدول الأعمال:\n1. تأخيرات بالإرساليات لمنطقة الجليل\n2. ميزانية لسيارة توزيع زيادة\n3. حفلة آخر السنة\nدانا فتحت الاجتماع وشكرت الكل إنهم إجوا عالوقت. ذكّرت إنه بالشهر الأخير كان في شكاوي كتير من زباين بالجليل على إرساليات وصلت متأخرة. حسب كلامها، الهدف إنهم يحلّوا المشكلة قبل آخر الشهر.",
   q:{q:"על מה התלוננו הלקוחות בגליל?", o:["על מחירים גבוהים","על משלוחים שהגיעו באיחור","על נהגים לא אדיבים","על מוצרים שבורים"], a:1}},
  {he:"נקודה 1: כרים הסביר שהבעיה העיקרית היא לוח הזמנים. הנהגים יוצאים מהמחסן מאוחר מדי, ונתקעים בפקקים. סאמי הציע להתחיל את העבודה במחסן שעה מוקדם יותר, בשש בבוקר. מאיה לא הסכימה: ״אני מבינה את הרעיון, אבל לא כל העובדים יכולים להגיע כל כך מוקדם. אולי כדאי לשקול משמרת שנייה במקום זה?״ אחרי דיון קצר הוחלט לנסות את ההצעה של סאמי במשך שבועיים, ולבדוק את התוצאות.\nנקודה 2: טל ביקש לקנות רכב חלוקה נוסף. דנה אמרה שהתקציב השנה מוגבל, ושהיא צריכה לשקול את הנושא עם ההנהלה.",
   ar:"نقطة 1: كريم شرح إنه المشكلة الأساسية هي الجدول الزمني. السوّاقين بيطلعوا من المخزن متأخر كتير، وبيعلقوا بأزمة السير. سامي اقترح يبلّشوا الشغل بالمخزن ساعة بكّير، الساعة ستة الصبح. مايا ما وافقت: «أنا فاهمة الفكرة، بس مش كل العمال بيقدروا ييجوا بهالبكّير. يمكن منيح نفكّر بوردية تانية بدالها؟» بعد نقاش قصير انقرر يجرّبوا اقتراح سامي لمدة أسبوعين، ويفحصوا النتائج.\nنقطة 2: طال طلب يشتروا سيارة توزيع زيادة. دانا قالت إنه الميزانية هالسنة محدودة، وإنها لازم تدرس الموضوع مع الإدارة.",
   q:{q:"מה הוחלט לגבי ההצעה של סאמי?", o:["לנסות אותה במשך שבועיים","לדחות אותה לגמרי","להצביע עליה בישיבה הבאה","לשאול את ההנהלה"], a:0}},
  {he:"נקודה 3: כולם הסכימו במהירות שהמסיבה תהיה בטבריה, ליד הים. זו הייתה ההחלטה הכי קלה של היום.\nסיכום ומשימות:\n• סאמי — אחראי על לוח הזמנים החדש במחסן, עד יום ראשון.\n• כרים — יעקוב אחרי זמני המשלוחים וידווח בישיבה הבאה.\n• דנה — תדבר עם ההנהלה לגבי התקציב לרכב.\n• מאיה — תבדוק מחירים של מסעדות בטבריה.\n• טל — ישלח את הפרוטוקול לכל המשתתפים.\nהישיבה הבאה: יום שלישי בעוד שבועיים, באותה שעה.\nרשם: טל",
   ar:"نقطة 3: الكل وافقوا بسرعة إنه الحفلة تكون بطبريا، جنب البحر. هاد كان أسهل قرار باليوم.\nتلخيص ومهام:\n• سامي — مسؤول عن الجدول الزمني الجديد بالمخزن، لحد يوم الأحد.\n• كريم — رح يتابع أوقات الإرساليات ويبلّغ بالاجتماع الجاي.\n• دانا — رح تحكي مع الإدارة بخصوص ميزانية السيارة.\n• مايا — رح تفحص أسعار مطاعم بطبريا.\n• طال — رح يبعت المحضر لكل المشاركين.\nالاجتماع الجاي: يوم التلاتا بعد أسبوعين، بنفس الساعة.\nكتب المحضر: طال",
   q:{q:"מה המשימה של מאיה?", o:["לעקוב אחרי זמני המשלוחים","לדבר עם ההנהלה","לבדוק מחירים של מסעדות בטבריה","לכתוב את הפרוטוקול"], a:2}}],
 tf:[["חמישה אנשים השתתפו בישיבה.",true],["מאיה תמכה מיד בהצעה של סאמי.",false],["דנה אישרה בישיבה את התקציב לרכב החדש.",false],["טל כתב את הפרוטוקול.",true]],
 order:["דנה פתחה את הישיבה","סאמי הציע להתחיל בשש בבוקר","טל ביקש רכב חלוקה נוסף","כולם הסכימו על מסיבה בטבריה"],
 find:{q:"איזה משפט מתאר את הבעיה העיקרית לפי כרים?", a:"הנהגים יוצאים מהמחסן מאוחר מדי, ונתקעים בפקקים."},
 words:[["יְשִׁיבַת צֶוֶת","يِشيڤات تسيڤيت","اجتماع فريق"],["סֵדֶר יוֹם","سيدِر يوم","جدول أعمال"],["לְהַצִּיעַ","لِهَتسيع","يقترح"],["לוּחַ זְמַנִּים","لواح زمَنيم","جدول زمني"],["תַּקְצִיב","تَكتسيڤ","ميزانية"],["לִשְׁקֹל","ليشكول","يدرس، يفكر بـ"],["מְשִׂימָה","مِسيما","مهمة"],["דִּיּוּן","ديون","نقاش"]]
},

{id:"4-4", title:"לקוח כועס בדלפק", ar:"زبون معصّب عالكاونتر", kind:"حوار", nq:false,
 segs:[
  {he:"נור: בוקר טוב, איך אפשר לעזור?\nאבי: בוקר טוב? אין פה שום דבר טוב! אני מחכה כבר ארבעים דקות בתור, וזו הפעם השלישית שאני מגיע לכאן!\nנור: אני מבינה אותך, ואני מצטערת על ההמתנה. ספר לי בבקשה מה קרה, ואני אנסה לעזור.\nאבי: הזמנתי מקרר לפני שבועיים. אמרו לי שהוא יגיע תוך חמישה ימים. עד היום אין מקרר, ואף אחד לא חוזר אליי!",
   ar:"نور: صباح الخير، كيف بقدر أساعد؟\nآڤي: صباح الخير؟ ما في هون ولا إشي منيح! صرلي أربعين دقيقة مستني بالدور، وهاي تالت مرة بإجي لهون!\nنور: أنا فاهمتك، وآسفة على الانتظار. احكيلي لو سمحت شو صار، ورح أحاول أساعد.\nآڤي: طلبت تلاجة قبل أسبوعين. قالولي إنها بتوصل خلال خمس أيام. لليوم ما في تلاجة، وولا حدا بيرجعلي!",
   q:{q:"כמה זמן אבי מחכה בתור?", o:["חמש דקות","ארבעים דקות","שעתיים","שבועיים"], a:1}},
  {he:"נור: זה באמת לא נעים, ואני מתנצלת על אי הנוחות. יש לך מספר הזמנה?\nאבי: הנה, הכול כתוב בקבלה.\nנור: תודה. רגע אחד, אני בודקת במערכת... אוקיי, אני רואה את ההזמנה. המקרר אזל מהמלאי, ולכן היה עיכוב. מישהו היה צריך להודיע לך, וזה לא קרה. אני ממש מצטערת.\nאבי: (קצת יותר רגוע) טוב, לפחות מישהו מסביר לי משהו.",
   ar:"نور: هاد فعلًا مش منيح، وبعتذر على الإزعاج. معك رقم الطلبية؟\nآڤي: هيّو، كل إشي مكتوب بالوصل.\nنور: شكرًا. لحظة وحدة، عم بفحص بالنظام... أوكي، شايفة الطلبية. التلاجة خلصت من المخزون، وعشان هيك صار تأخير. كان لازم حدا يبلّغك، وهاد ما صار. أنا كتير آسفة.\nآڤي: (أهدى شوي) طيب، على الأقل في حدا بيشرحلي إشي.",
   q:{q:"למה היה עיכוב בהזמנה?", o:["אבי נתן כתובת לא נכונה","המקרר אזל מהמלאי","הנהג היה חולה","אבי לא שילם"], a:1}},
  {he:"נור: יש שני פתרונות. המלאי החדש מגיע למחסן ביום חמישי, ונוכל לשלוח לך את המקרר ביום ראשון. או, אם אתה מעדיף, יש דגם דומה שנמצא במחסן כבר עכשיו, והוא יכול להגיע מחר.\nאבי: הדגם הדומה — הוא יותר יקר?\nנור: הוא עולה מאה שקל יותר, אבל בגלל העיכוב אבקש אישור מנהל, ולא תשלם את ההפרש.\nאבי: באמת? זה כבר נשמע אחרת.\nנור: אני אדאג לזה באופן אישי, ואתקשר אליך היום עד חמש כדי לאשר את שעת המשלוח.\nאבי: תודה. ואני מצטער שצעקתי קודם.\nנור: אין בעיה, אני מבינה. יום טוב!",
   ar:"نور: في حلّين. المخزون الجديد بيوصل عالمخزن يوم الخميس، ومنقدر نبعتلك التلاجة يوم الأحد. أو، إذا بتفضّل، في موديل شبهها موجود بالمخزن من هلأ، وبيقدر يوصل بكرا.\nآڤي: الموديل الشبهها — أغلى؟\nنور: سعره مية شيكل زيادة، بس بسبب التأخير رح أطلب موافقة مدير، وما رح تدفع الفرق.\nآڤي: عنجد؟ هيك صار الحكي غير.\nنور: أنا رح أهتم بالموضوع شخصيًا، وبتصل فيك اليوم لحد الساعة خمسة عشان أأكد ساعة التوصيل.\nآڤي: شكرًا. وأنا آسف إني صرخت قبل.\nنور: ولا يهمك، أنا فاهمة. نهارك سعيد!",
   q:{q:"מה נור מבטיחה לעשות היום?", o:["להחזיר לאבי את הכסף","להתקשר לאבי עד חמש","לשלוח את המקרר היום","לדבר עם הנהג"], a:1}}],
 tf:[["אבי מגיע לחנות בפעם הראשונה.",false],["נור התנצלה כמה פעמים.",true],["הדגם הדומה עולה מאה שקל יותר.",true],["אבי יצטרך לשלם את ההפרש.",false],["בסוף אבי התנצל שצעק.",true]],
 order:["אבי מתלונן על ההמתנה","נור בודקת את ההזמנה במערכת","נור מציעה שני פתרונות","אבי מתנצל שצעק"],
 find:{q:"איזה משפט אומרת נור כדי להסביר את העיכוב?", a:"המקרר אזל מהמלאי, ולכן היה עיכוב."},
 words:[["לָקוֹחַ","لاكوَح","زبون"],["עִכּוּב","عيكوڤ","تأخير"],["הַמְתָּנָה","هَمتانا","انتظار"],["אִי הַנּוֹחוּת","إي هانوحوت","الإزعاج"],["אָזַל מֵהַמְּלַאי","أزال مِهامِلاي","خلص من المخزون"],["פִּתְרוֹן","پِترون","حل"],["אִישׁוּר מְנַהֵל","إيشور مِنَهيل","موافقة مدير"],["לִדְאֹג","لِدئوچ","يهتم، يتأكد"]]
},

{id:"4-5", title:"דוח רבעוני: מכירות באתר", ar:"تقرير ربع سنوي: المبيعات عالموقع", kind:"تقرير", nq:false,
 segs:[
  {he:"דוח רבעוני: מכירות באתר האינטרנט — רבעון שלישי\nהוכן על ידי: ראנייה, מחלקת שיווק, עכו\nמבוא: הדוח מציג את הנתונים של החנות שלנו באתר האינטרנט בחודשים יולי, אוגוסט וספטמבר, בהשוואה לרבעון השני. המטרה היא לבדוק אם הגענו ליעד שקבענו בתחילת השנה: עלייה של עשרה אחוזים במכירות. הנתונים נאספו ממערכת ההזמנות של האתר ומסקר קצר שמילאו 300 לקוחות.",
   ar:"تقرير ربع سنوي: المبيعات عموقع الإنترنت — الربع التالت\nإعداد: رانية، قسم التسويق، عكا\nمقدمة: التقرير بيعرض معطيات محلّنا عموقع الإنترنت بشهر تموز وآب وأيلول، مقارنة بالربع التاني. الهدف إنّا نفحص إذا وصلنا للهدف اللي حطّيناه بأول السنة: ارتفاع عشرة بالمية بالمبيعات. المعطيات انجمعت من نظام الطلبيات بالموقع ومن استطلاع قصير عبّوه 300 زبون.",
   q:{q:"מה היה היעד שנקבע בתחילת השנה?", o:["עלייה של עשרים אחוז","עלייה של עשרה אחוזים","ירידה בהחזרות","אתר חדש"], a:1}},
  {he:"תוצאות עיקריות:\n• סך ההכנסות מהאתר: 480,000 שקל, לעומת 400,000 שקל ברבעון הקודם — עלייה של עשרים אחוז.\n• מספר ההזמנות עלה מ-2,000 ל-2,300.\n• לפי הנתונים, כמחצית מהלקוחות הזמינו דרך הטלפון הנייד, ולא דרך המחשב.\n• מנגד, הייתה ירידה של חמישה אחוזים במכירות של אוגוסט בהשוואה ליולי, כנראה בגלל החופש הגדול.\n• שיעור ההחזרות ירד מ-8% ל-6% בלבד.\n• הלקוחות הקבועים ביצעו שליש מכל ההזמנות, והממוצע של כל הזמנה היה כ-210 שקל.\n• לפי הסקר, רוב הלקוחות מרוצים מזמני המשלוח.",
   ar:"النتائج الأساسية:\n• مجموع المدخولات من الموقع: 480,000 شيكل، مقابل 400,000 شيكل بالربع اللي قبله — ارتفاع عشرين بالمية.\n• عدد الطلبيات طلع من 2,000 لـ 2,300.\n• حسب المعطيات، تقريبًا نص الزباين طلبوا من التلفون المحمول، مش من الكمبيوتر.\n• بالمقابل، كان في انخفاض خمسة بالمية بمبيعات آب مقارنة بتموز، على الأغلب بسبب العطلة الصيفية.\n• نسبة المرتجعات نزلت من 8% لـ 6% بس.\n• الزباين الدائمين عملوا تلت كل الطلبيات، ومعدل كل طلبية كان حوالي 210 شيكل.\n• حسب الاستطلاع، أغلب الزباين راضيين عن أوقات التوصيل.",
   q:{q:"מה קרה למכירות באוגוסט?", o:["הן עלו בעשרים אחוז","הן לא השתנו","הן ירדו בחמישה אחוזים","הן ירדו בחצי"], a:2}},
  {he:"מסקנות: המגמה חיובית באופן ברור. עברנו את היעד, ואפילו פי שניים: תכננו עלייה של עשרה אחוזים, והגענו לעשרים. הממצאים מראים שהלקוחות שלנו מעדיפים לקנות בטלפון, ושהם מרוצים יותר מהמוצרים, כי פחות אנשים מחזירים אותם.\nהמלצות:\n1. מומלץ לשפר את האתר לטלפונים ניידים, כדי שיהיה מהיר ונוח יותר.\n2. מומלץ להכין מבצע מיוחד לחודש אוגוסט בשנה הבאה, כדי למנוע את הירידה.\n3. מומלץ להציג את הדוח בישיבת ההנהלה הקרובה ולקבוע יעד חדש לרבעון הרביעי.\n4. מומלץ לשלוח ללקוחות הקבועים קופון הנחה, כדי לחזק את הקשר איתם ולעודד אותם לחזור.",
   ar:"استنتاجات: الاتجاه إيجابي بشكل واضح. عدّينا الهدف، وكمان بالضعف: خطّطنا لارتفاع عشرة بالمية، ووصلنا لعشرين. النتائج بتبيّن إنه زباينّا بيفضّلوا يشتروا بالتلفون، وإنهم راضيين أكتر عن المنتجات، لأنه ناس أقل بيرجّعوها.\nتوصيات:\n1. يُنصح نحسّن الموقع للتلفونات المحمولة، عشان يكون أسرع وأريح.\n2. يُنصح نحضّر عرض خاص لشهر آب بالسنة الجاية، عشان نمنع الانخفاض.\n3. يُنصح نعرض التقرير باجتماع الإدارة الجاي ونحط هدف جديد للربع الرابع.\n4. يُنصح نبعت للزباين الدائمين كوبون خصم، عشان نقوّي العلاقة معهم ونشجّعهم يرجعوا.",
   q:{q:"למה ראנייה חושבת שהלקוחות מרוצים יותר מהמוצרים?", o:["כי פחות אנשים מחזירים אותם","כי המחירים ירדו","כי האתר חדש","כי יש מבצע באוגוסט"], a:0}}],
 tf:[["ההכנסות מהאתר עלו בעשרים אחוז.",true],["רק מעט לקוחות הזמינו דרך הטלפון הנייד.",false],["שיעור ההחזרות עלה ברבעון השלישי.",false],["הדוח ממליץ לשפר את האתר לטלפונים ניידים.",true]],
 find:{q:"איזה משפט מראה שעברו את היעד פי שניים?", a:"תכננו עלייה של עשרה אחוזים, והגענו לעשרים."},
 words:[["דּוּחַ","دوح","تقرير"],["נְתוּנִים","نِتونيم","معطيات"],["רִבְעוֹן","ريڤعون","ربع سنة"],["אָחוּז","أحوز","بالمية (نسبة)"],["מְגַמָּה","مَچَما","اتجاه"],["יַעַד","ياعَد","هدف"],["הַמְלָצָה","هَملاتسا","توصية"],["מַסְקָנָה","مَسكانا","استنتاج"]]
},

{id:"4-6", title:"תור בלי תור", ar:"دور بلا دور", kind:"نص عرض تقديمي", nq:false,
 segs:[
  {he:"[שקף 1 — כותרת: ״תור בלי תור״]\nבוקר טוב לכולם, ותודה שהגעתם. שמי כרים, ואני עובד בדלפק קבלת הקהל של העירייה בנצרת כבר חמש שנים. היום אני רוצה להציג לכם רעיון פשוט שיכול לחסוך לנו הרבה זמן וכסף. אני מבקש את תשומת הלב שלכם לעשר דקות בלבד. אני מבטיח לדבר בקצרה, ואחרי זה אשמח לענות על שאלות.\nהמטרה של המצגת: לשכנע אתכם לנסות מערכת של תורים באינטרנט.",
   ar:"[شريحة 1 — العنوان: «دور بلا دور»]\nصباح الخير للكل، وشكرًا إنكم إجيتوا. اسمي كريم، وبشتغل عكاونتر استقبال الجمهور بالبلدية بالناصرة صرلي خمس سنين. اليوم بدي أعرضلكم فكرة بسيطة ممكن توفّرلنا وقت ومصاري كتير. بطلب انتباهكم لعشر دقايق بس. بوعدكم أحكي باختصار، وبعدها بيسعدني أجاوب على أسئلة.\nهدف العرض: إني أقنعكم تجرّبوا نظام أدوار عالإنترنت.",
   q:{q:"איפה כרים עובד?", o:["בחברת הייטק","בדלפק קבלת הקהל של העירייה","במחסן","בבית ספר"], a:1}},
  {he:"[שקף 2 — הבעיה]\nראשית, בואו נסתכל על המצב היום. כל בוקר מגיעים אלינו בערך מאה ועשרים תושבים. הרבה מהם מחכים יותר משעה, ורבים כועסים עוד לפני שהם מגיעים לדלפק. גם העובדים שלנו עייפים ולחוצים, ולפעמים נשארים אחרי סוף המשמרת. לדוגמה, בשבוע שעבר תושבת חיכתה שעה וחצי רק כדי לקבל טופס אחד.\n[שקף 3 — הפתרון]\nשנית, הפתרון: התושבים יקבעו תור באתר או בטלפון, ויגיעו בדיוק בשעה שלהם. ככה לא יהיו תורים ארוכים, והעובדים יוכלו להתכונן מראש לכל פנייה.",
   ar:"[شريحة 2 — المشكلة]\nأولًا، خلّونا نطّلع عالوضع اليوم. كل صبح بيجينا تقريبًا مية وعشرين ساكن. كتير منهم بيستنّوا أكتر من ساعة، وكتار بيكونوا معصّبين قبل ما يوصلوا عالكاونتر. وكمان موظفينّا تعبانين ومضغوطين، وأحيانًا بيضلّوا بعد آخر الوردية. مثلًا، الأسبوع الماضي ساكنة استنّت ساعة ونص بس عشان تاخد نموذج واحد.\n[شريحة 3 — الحل]\nثانيًا، الحل: السكان بيحجزوا دور عالموقع أو بالتلفون، وبيوصلوا بالزبط بساعتهم. هيك ما بيكون في أدوار طويلة، والموظفين بيقدروا يتحضّروا مسبقًا لكل طلب.",
   q:{q:"כמה זמן חיכתה התושבת בשבוע שעבר?", o:["עשר דקות","שעה","שעה וחצי","שלוש שעות"], a:2}},
  {he:"[שקף 4 — העלות]\nעכשיו, אני יודע שכולכם חושבים על דבר אחד: כמה זה עולה? העלות של המערכת היא כעשרים אלף שקל לשנה. אבל לפי החישוב שלי, נחסוך יותר משלושים אלף שקל בשעות נוספות.\n[שקף 5 — סיכום]\nלבסוף, בקצרה: פחות המתנה, תושבים מרוצים יותר, ועבודה רגועה יותר בשבילנו. אני מציע לנסות את המערכת במשך שלושה חודשים, ולבדוק את התוצאות.\nתודה על ההקשבה. עכשיו אשמח לשאלות... כן, טל, בבקשה.",
   ar:"[شريحة 4 — التكلفة]\nهلأ، بعرف إنه كلكم بتفكروا بإشي واحد: قدّيش بتكلّف؟ تكلفة النظام تقريبًا عشرين ألف شيكل بالسنة. بس حسب حسابي، رح نوفّر أكتر من تلاتين ألف شيكل بالساعات الإضافية.\n[شريحة 5 — تلخيص]\nأخيرًا، باختصار: انتظار أقل، سكان راضيين أكتر، وشغل أهدى إلنا. بقترح نجرّب النظام لمدة تلات شهور، ونفحص النتائج.\nشكرًا على الإصغاء. هلأ بيسعدني أسمع أسئلة... آه، طال، تفضّل.",
   q:{q:"כמה כסף כרים חושב שהעירייה תחסוך?", o:["עשרים אלף שקל","יותר משלושים אלף שקל","מאה ועשרים שקל","לא תחסוך בכלל"], a:1}}],
 tf:[["כרים עובד בעירייה כבר חמש שנים.",true],["כל בוקר מגיעים בערך עשרים תושבים.",false],["המערכת עולה כעשרים אלף שקל לשנה.",true],["כרים מציע לנסות את המערכת במשך שנה.",false]],
 order:["כרים מציג את עצמו","כרים מתאר את הבעיה","כרים מסביר את הפתרון","כרים מדבר על העלות","כרים מזמין שאלות"],
 find:{q:"איזה משפט מסכם את היתרונות בקצרה?", a:"לבסוף, בקצרה: פחות המתנה, תושבים מרוצים יותר, ועבודה רגועה יותר בשבילנו."},
 words:[["מַצֶּגֶת","مَتسيچِت","عرض تقديمي"],["שֶׁקֶף","شيكِف","شريحة"],["לְהַצִּיג","لِهَتسيچ","يعرض"],["רֵאשִׁית","ريشيت","أولًا"],["שֵׁנִית","شينيت","ثانيًا"],["לְבַסּוֹף","لِڤَسوف","أخيرًا"],["לַחְסֹךְ","لاحسوخ","يوفّر"],["עֲלוּת","عَلوت","تكلفة"]]
},

{id:"4-7", title:"התלוש הראשון של עומר", ar:"أول قسيمة راتب لعمر", kind:"نص معلوماتي", nq:false,
 segs:[
  {he:"עומר התחיל לעבוד לפני חודש במחסן של חברת הובלות באילת. בסוף החודש הוא קיבל את תלוש השכר הראשון שלו, והסתכל עליו בבלבול. ״כתוב פה ברוטו 9,000 שקל, אבל בבנק נכנסו רק 7,600. איפה שאר הכסף?״ הוא שאל את דנה, שעובדת איתו כבר הרבה שנים.\nדנה חייכה: ״כולם שואלים את זה בחודש הראשון. בוא נקרא את התלוש ביחד.״",
   ar:"عمر بلّش يشتغل من شهر بمخزن شركة نقليات بإيلات. بآخر الشهر استلم أول قسيمة راتب إله، وتطلّع عليها وهو مش فاهم. «مكتوب هون بروطو 9,000 شيكل، بس بالبنك نزل بس 7,600. وين باقي المصاري؟» سأل دانا، اللي بتشتغل معه من سنين كتير.\nدانا ابتسمت: «الكل بيسألوا هالسؤال بأول شهر. تعال نقرا القسيمة سوا.»",
   q:{q:"כמה כסף נכנס לעומר לבנק?", o:["9,000 שקל","7,600 שקל","1,400 שקל","לא נכנס כסף"], a:1}},
  {he:"״ברוטו זה השכר לפני הניכויים,״ הסבירה דנה. ״נטו זה מה שנכנס לך לחשבון בפועל. ההפרש הולך לכמה מקומות: מס הכנסה, ביטוח לאומי, ביטוח בריאות וכסף לפנסיה. הפנסיה היא לא כסף שהולך לאיבוד — היא נשמרת בשבילך לעתיד.״\nעומר הסתכל שוב על התלוש. ״ומה זאת השורה הזאת, שעות נוספות?״\n״אם עבדת יותר מהשעות הרגילות ביום, מגיע לך תשלום גבוה יותר על השעות האלה. בדוק שהמספר בתלוש מתאים למה שרשמת.״",
   ar:"«بروطو هو الراتب قبل الخصومات،» شرحت دانا. «نيطو هو اللي بينزل بحسابك فعليًا. الفرق بيروح لكم محل: ضريبة دخل، تأمين وطني، تأمين صحي ومصاري للتقاعد. التقاعد مش مصاري بتضيع — هي بتنحفظلك للمستقبل.»\nعمر تطلّع كمان مرة عالقسيمة. «وشو هالسطر، ساعات إضافية؟»\n«إذا اشتغلت أكتر من الساعات العادية باليوم، بيستحقلك دفع أعلى على هالساعات. افحص إنه الرقم بالقسيمة بيطابق اللي سجّلته.»",
   q:{q:"מה זה ״נטו״ לפי דנה?", o:["השכר לפני הניכויים","הכסף לפנסיה","מה שנכנס לחשבון בפועל","מס הכנסה"], a:2}},
  {he:"דנה הוסיפה עוד כמה דברים חשובים: ״לכל עובד יש זכויות, גם בעבודה הראשונה. יש חופשה שנתית, ימי מחלה, ואחרי שנה גם דמי הבראה. אסור שהשכר שלך יהיה נמוך משכר מינימום. כדאי לשמור את כל התלושים, ולבקש עותק של חוזה העבודה.״\n״ואם אני חושב שיש טעות?״\n״קודם כול, שואלים בנימוס. לא צועקים ולא מאשימים. פשוט כותבים למחלקת השכר: ׳שלום, לגבי התלוש של החודש — נראה לי שחסרות שעות נוספות. אשמח אם תבדקו. תודה מראש.׳ ואם עדיין לא בטוחים, אפשר לפנות לגורם מקצועי שמתמחה בזכויות עובדים.״\nעומר שלח את המייל עוד באותו ערב.\n(שימו לב: המידע בטקסט הזה כללי בלבד, והוא לא ייעוץ משפטי.)",
   ar:"دانا زادت كم إشي مهم: «كل عامل إله حقوق، حتى بأول شغل. في إجازة سنوية، أيام مرضية، وبعد سنة كمان بدل استجمام. ممنوع يكون راتبك أقل من الحد الأدنى للأجور. منيح تحتفظ بكل القسايم، وتطلب نسخة من عقد العمل.»\n«وإذا حاسس إنه في غلط؟»\n«أول إشي، بتسأل بأدب. ما بتصرخ وما بتتّهم. ببساطة بتكتب لقسم الرواتب: ׳مرحبا، بخصوص قسيمة هالشهر — بيبيّنلي إنه ناقص ساعات إضافية. بيسعدني إذا بتفحصوا. شكرًا مسبقًا.׳ وإذا لسّا مش متأكد، بتقدر تتوجّه لجهة مهنية مختصة بحقوق العمال.»\nعمر بعت الإيميل بنفس المسا.\n(انتبهوا: المعلومات بهالنص عامة بس، ومش استشارة قانونية.)",
   q:{q:"מה דנה ממליצה לעשות קודם אם יש טעות בתלוש?", o:["ללכת ישר לבית המשפט","לשאול בנימוס את מחלקת השכר","להתפטר","לחכות שנה"], a:1}}],
 tf:[["עומר עובד במחסן באילת.",true],["ברוטו זה הכסף שנכנס לחשבון.",false],["הכסף לפנסיה הולך לאיבוד.",false],["דנה ממליצה לשמור את כל התלושים.",true],["עומר שלח מייל למחלקת השכר.",true]],
 order:["עומר קיבל את התלוש הראשון","עומר שאל את דנה איפה שאר הכסף","דנה הסבירה מה זה ברוטו ונטו","עומר שלח מייל למחלקת השכר"],
 find:{q:"איזה משפט מסביר מה זה ברוטו?", a:"״ברוטו זה השכר לפני הניכויים,״ הסבירה דנה."},
 words:[["תְּלוּשׁ שָׂכָר","تلوش ساخار","قسيمة راتب"],["בְּרוּטוֹ","بروطو","قبل الخصومات"],["נֶטוֹ","نيطو","بعد الخصومات"],["נִכּוּיִים","نيكوييم","خصومات"],["מַס הַכְנָסָה","ماس هَخناسا","ضريبة دخل"],["שָׁעוֹת נוֹסָפוֹת","شاعوت نوساڤوت","ساعات إضافية"],["דְּמֵי הַבְרָאָה","دمي هَڤرائا","بدل استجمام"],["מַגִּיעַ לִי","مَچيع لي","بيستحقلي"]]
},

{id:"4-8", title:"ראיון העבודה של לינה", ar:"مقابلة العمل تبعت لينا", kind:"مقابلة", nq:false,
 segs:[
  {he:"מאיה: שלום לינה, תודה שהגעת. ספרי לי קצת על עצמך.\nלינה: שלום, ותודה על ההזמנה. אני גרה בחיפה, ויש לי ארבע שנות ניסיון בשירות לקוחות. בשנתיים האחרונות אני ראש צוות בחברת תקשורת, ואני אחראית על שמונה עובדים. אני דוברת עברית, ערבית ואנגלית.\nמאיה: מצוין. ומה החוזקות שלך?\nלינה: אני יודעת לעבוד בצוות, לפתור בעיות מהר ולהקשיב ללקוחות בסבלנות. העובדים שלי אומרים שאני מסבירה דברים בצורה ברורה.",
   ar:"مايا: أهلا لينا، شكرًا إنك إجيتي. احكيلي شوي عن حالك.\nلينا: أهلا، وشكرًا على الدعوة. أنا ساكنة بحيفا، وعندي أربع سنين خبرة بخدمة الزباين. بآخر سنتين أنا رئيسة فريق بشركة اتصالات، ومسؤولة عن تمان موظفين. بحكي عبري، عربي وإنجليزي.\nمايا: ممتاز. وشو نقاط قوتك؟\nلينا: بعرف أشتغل بفريق، أحل مشاكل بسرعة وأسمع للزباين بصبر. الموظفين عندي بيقولوا إني بشرح الأمور بشكل واضح.",
   q:{q:"על כמה עובדים לינה אחראית היום?", o:["ארבעה","שמונה","שנים עשר","אף אחד"], a:1}},
  {he:"מאיה: ספרי לי על מקרה קשה עם לקוח.\nלינה: פעם פנה אלינו לקוח שהיה מאוד כועס, כי האינטרנט שלו לא עבד שלושה ימים. קודם כול הקשבתי לו עד הסוף ולא קטעתי אותו. אחר כך התנצלתי, בדקתי את הנושא מול המחלקה הטכנית, ומצאתי פתרון עוד באותו יום. בסוף הוא שלח לנו משוב חיובי, ונשאר לקוח קבוע.\nמאיה: ומה למדת מהמקרה הזה?\nלינה: שלפעמים הלקוח צריך קודם כול שמישהו יקשיב לו, ורק אחר כך פתרון.",
   ar:"مايا: احكيلي عن موقف صعب مع زبون.\nلينا: مرة توجّه إلنا زبون كان كتير معصّب، لأنه الإنترنت عنده ما اشتغل تلات أيام. أول إشي سمعته للآخر وما قاطعته. بعدين اعتذرت، فحصت الموضوع مع القسم الفني، ولقيت حل بنفس اليوم. بالآخر بعتلنا تقييم إيجابي، وضلّ زبون دائم.\nمايا: وشو تعلّمتي من هالموقف؟\nلينا: إنه أحيانًا الزبون بحاجة أول إشي لحدا يسمعله، وبعدين بس للحل.",
   q:{q:"מה לינה עשתה קודם כול עם הלקוח הכועס?", o:["העבירה אותו למנהל","הקשיבה לו עד הסוף","נתנה לו החזר כספי","ביקשה שיחזור מחר"], a:1}},
  {he:"מאיה: למה את רוצה לעבוד אצלנו?\nלינה: כי החברה שלכם מובילה בתחום, ואני רוצה להתפתח מקצועית. ראיתי שאתם פותחים מוקד שירות חדש בצפון, ואני חושבת שהניסיון שלי יכול לעזור מאוד.\nמאיה: מה ציפיות השכר שלך?\nלינה: לפי הניסיון שלי והשוק, אני מצפה לשכר של שנים עשר אלף שקל ברוטו. כמובן שאשמח לשמוע גם על התנאים הנוספים.",
   ar:"مايا: ليش بدك تشتغلي عنّا؟\nلينا: لأنه شركتكم رائدة بالمجال، وبدي أتطوّر مهنيًا. شفت إنكم فاتحين مركز خدمة جديد بالشمال، وبفكّر إنه خبرتي بتقدر تساعد كتير.\nمايا: شو توقعاتك للراتب؟\nلينا: حسب خبرتي والسوق، بتوقّع راتب اتناعش ألف شيكل بروطو. طبعًا بيسعدني أسمع كمان عن الشروط الإضافية.",
   q:{q:"למה לינה רוצה לעבוד בחברה?", o:["כי אין לה עבודה","כי החברה מובילה בתחום והיא רוצה להתפתח","כי החברה קרובה לבית","כי השכר נמוך"], a:1}},
  {he:"מאיה: יש לך שאלות אלינו?\nלינה: כן. איך נראה יום עבודה רגיל בתפקיד? ומתי אתם מתכננים לפתוח את המוקד החדש?\nמאיה: שאלות טובות. יום רגיל מתחיל בישיבת צוות קצרה, ואחר כך עובדים עם הלקוחות ועם הדוחות. המוקד ייפתח בעוד חודשיים. תודה רבה, לינה. נחזור אלייך עד סוף השבוע.\nלינה: תודה רבה על ההזדמנות. אשמח לשמוע מכם.",
   ar:"مايا: عندك أسئلة إلنا؟\nلينا: آه. كيف بيكون يوم شغل عادي بالوظيفة؟ وإمتى مخطّطين تفتحوا المركز الجديد؟\nمايا: أسئلة منيحة. اليوم العادي بيبلّش باجتماع فريق قصير، وبعدين منشتغل مع الزباين ومع التقارير. المركز رح ينفتح بعد شهرين. شكرًا كتير، لينا. منرجعلك قبل آخر الأسبوع.\nلينا: شكرًا كتير على الفرصة. بيسعدني أسمع منكم.",
   q:{q:"מתי ייפתח המוקד החדש?", o:["בעוד שבוע","בסוף השבוע","בעוד חודשיים","בעוד שנה"], a:2}}],

    if(c!=="ו"&&(marks.includes("\u05B9")||marks.includes("\u05BB"))&&nx!=="ו")out+="ו";else if(marks.includes("\u05B4")&&nx!=="י"&&j<ch.length)out+="י";}return out;}
function lookup(tok){if(!DMAP){DMAP=new Map();L.dict().forEach(e=>{DMAP.set(e.h,e);if(e.p){const k=plene(e.p);if(k!==e.h&&!DMAP.has(k))DMAP.set(k,e);}});}
  const base=stripN(tok).replace(/[^א-ת'"״׳-]/g,"").replace(/^[-'"״׳]+|[-'"״׳]+$/g,"");
  const pw=RS&&RS.p?RS.p.words.map(w=>({h:stripN(w[0]),p:w[0],r:w[1],m:w[2]})):[];
  const find=k=>DMAP.get(k)||pw.find(w=>w.h===k);
  let e=find(base);if(e)return{e,base};
  const pre="והבלמשכ";let k=base;for(let i=0;i<3&&k.length>2&&pre.includes(k[0]);i++){k=k.slice(1);e=find(k);if(e)return{e,base,pre:base.slice(0,base.length-k.length)};}
  const nm=L.names[base]||(/^[והבלמש]/.test(base)&&(L.names[base.slice(1)]||(/^[והבלמש]/.test(base.slice(1))&&L.names[base.slice(2)])));if(nm)return{e:null,base,name:nm};
  const stems=[base];k=base;for(let i=0;i<3&&k.length>2&&pre.includes(k[0]);i++){k=k.slice(1);stems.push(k);}
  const SUF=[["ים",""],["ים","ה"],["ות","ה"],["ות",""],["ת","ה"],["ת",""],["ה",""],["ו",""],["תי",""],["נו",""],["תם",""],["ית","י"]];
  for(const st of stems)for(const [a,b] of SUF){if(st.endsWith(a)&&st.length-a.length>=2){e=find(st.slice(0,-a.length)+b);if(e)return{e,base,approx:true};}}
  for(const st of stems)if(st.length>3&&"יתאנ".includes(st[0])){const r=st.slice(1);for(const v of [r,r.replace(/ו$/,"")]){e=find(v);if(e)return{e,base,approx:true};}}
  return{e:null,base};}
const PRE_AR={"ו":"و","ה":"الـ","ב":"بـ","ל":"لـ","מ":"من","ש":"اللي","כ":"زي"};
function rdSheet(){const {e,base,pre}=RW;const sv=e&&(P.myWords||[]).includes(e.h);
  return `<div class="rd-sheet" role="dialog" aria-label="معنى الكلمة"><button type="button" class="rd-close" data-rwclose aria-label="سكّر">✕</button>
  <span class="he" lang="he">${esc(RW.tok)}</span>
  ${RW.name?`<b class="rd-mean">اسم: ${esc(RW.name)}</b><small>اسم شخص بالقطعة.</small>`:e?`${RW.approx?`<small class="lead">قريبة من الكلمة: <span lang="he">${esc(e.p||e.h)}</span> (نفس الكلمة بصيغة ثانية)</small>`:pre?`<small class="lead">${[...pre].map(c=>PRE_AR[c]).join(" + ")} + <span lang="he">${esc(e.p||e.h)}</span></small>`:(e.h!==base?`<small class="lead">من الكلمة: <span lang="he">${esc(e.p||e.h)}</span></small>`:"")}
    <b class="rd-mean">${esc(e.m)}</b>${e.r?`<small>«${esc(e.r)}»</small>`:""}
    <div class="tr-row"><button type="button" class="speak" data-say="${esc(e.h)}">${SAY} اسمع</button><button type="button" class="btn ${sv?"ghost":""}" data-dsave="${esc(e.h)}" style="min-height:44px;padding:8px 14px">${sv?"✓ محفوظة":"احفظها"}</button></div>`
  :`<p class="lead">هالكلمة لسا مش بالقاموس. افتح «الترجمة» تحت المقطع عشان تفهمها من الجملة.</p><button type="button" class="speak" data-say="${esc(base)}">${SAY} اسمع</button>`}</div>`;}
document.addEventListener("click",e=>{
  if(curView!=="train")return;
  if(e.target.closest("[data-rdhome]")){RS="lib";route("train");return;}
  if(e.target.closest("[data-rdback]")){RS=null;route("train");return;}
  if(e.target.closest("[data-rdlib]")){RS="lib";RW=null;route("train");return;}
  const o=e.target.closest("[data-rdopen]");if(o){RW=null;startRead(o.dataset.rdopen);return;}
  if(!RS||RS==="lib")return;
  const sy=window.scrollY,rr=()=>{route("train");window.scrollTo(0,sy);};
  if(e.target.closest("[data-rwclose]")){RW=null;rr();return;}
  const w=e.target.closest("[data-rw]");if(w){const r=lookup(w.dataset.rw);RW={tok:w.dataset.rw,...r};rr();if(r.e)speakSoft(r.e.h);return;}
  if(e.target.closest("[data-rdnq]")){RS.nq=!RS.nq;rr();return;}
  const t=e.target.closest("[data-rdtr]");if(t){const i=+t.dataset.rdtr;RS.tr[i]=!RS.tr[i];rr();return;}
  const q=e.target.closest("[data-rdq]");if(q){RS.qa[q.dataset.rdq]=+q.dataset.i;rr();return;}
  if(e.target.closest("[data-rdnext]")){RS.seg++;rr();setTimeout(()=>{const s=document.querySelectorAll(".rd-seg");if(s.length)s[s.length-1].scrollIntoView({behavior:"smooth",block:"start"});},50);return;}
  if(e.target.closest("[data-rdfinal]")){RS.phase="final";rr();setTimeout(()=>{const f=document.querySelector(".rd-final");if(f)f.scrollIntoView({behavior:"smooth",block:"start"});},50);return;}
  const tf=e.target.closest("[data-rdtf]");if(tf){RS.tf[+tf.dataset.rdtf]=tf.dataset.v==="true";rr();return;}
  const od=e.target.closest("[data-rdord]");if(od){RS.ord.push(+od.dataset.rdord);rr();return;}
  if(e.target.closest("[data-rdordundo]")){RS.ord.pop();rr();return;}
  const fd=e.target.closest("[data-rdfind]");if(fd){RS.find=+fd.dataset.rdfind;RS.findOk=fd.dataset.ok==="1";rr();return;}
});
function speakSoft(t){const b=document.querySelector(".rd-sheet [data-say]");if(b)b.click();}
/* ===== word packs ===== */
let PK=null; // null | "list" | {id,flip:Set}
const packOpen=id=>P.admin||isDone(id)||(L.has(id)&&L.progress(id)>0);
function packWords(id){const k=L.pack(id);return k.a.concat(k.b);}
function packLib(){const S=srsGet();
  return `${brand()}<div class="rd-top"><button type="button" class="tr-x" data-pkback aria-label="رجوع">→</button><div><h1 style="font-size:24px">بطاقات الكلمات</h1><p class="lead" style="font-size:14px">حزمة كلمات لكل وحدة. قلّب البطاقات، وبعدين اختبر حالك.</p></div></div>
  ${[1,2,3,4].map(n=>{const lv=LEVELS[n];return `<div class="rd-lv"><span class="eyebrow">${LVN[n]}</span>${lv.units.map((un,u)=>{const id=uid(n,u),ws=packWords(id);if(!ws.length)return "";const op=packOpen(id);
    const known=ws.filter(w=>{const c=S[stripN(w[0])];return c&&c[0]>=2;}).length;
    return `<button type="button" class="rd-item ${op?"":"locked"}" data-pkopen="${id}"><span class="pk-name">${esc(un[0])}</span><span class="rd-meta"><small>${ws.length} كلمة · بتعرف ${known}</small><span class="pk-bar"><i style="width:${Math.round(known/ws.length*100)}%"></i></span></span><span class="rd-state">${op?"افتح":"🔒"}</span></button>`;}).join("")}</div>`;}).join("")}`;}
function packView(){const id=PK.id,n=+id[0],u=+id.split("-")[1]-1,ws=packWords(id);
  return `${brand()}<div class="rd-top"><button type="button" class="tr-x" data-pklist aria-label="رجوع">→</button><div><h1 style="font-size:22px">${esc(LEVELS[n].units[u][0])}</h1><p class="lead" style="font-size:14px">المستوى ${n} · ${ws.length} كلمة · اكبس على البطاقة عشان تقلبها</p></div></div>
  <div class="tr-row"><button type="button" class="btn ghost" data-pkall>${PK.all?"اقلبهم كلهم لورا":"اقلبهم كلهم"}</button><button type="button" class="btn" data-tr="pack:${id}">اختبرني</button></div>
  <div class="pk-grid">${ws.map((w,i)=>{const f=PK.all||PK.flip.has(i);return `<button type="button" class="pk-card ${f?"on":""}" data-pkflip="${i}">${f?`<b>${esc(w[2])}</b><small>«${esc(w[1])}»</small>`:`<span class="he" lang="he">${esc(w[0])}</span>`}</button>`;}).join("")}</div>`;}
document.addEventListener("click",e=>{
  if(curView!=="train")return;
  if(e.target.closest("[data-pkhome]")){PK="list";route("train");return;}
  if(e.target.closest("[data-pkback]")){PK=null;route("train");return;}
  if(e.target.closest("[data-pklist]")){PK="list";route("train");return;}
  const o=e.target.closest("[data-pkopen]");if(o){const id=o.dataset.pkopen;if(!packOpen(id)){toast("هاي الحزمة بتنفتح لما توصل لوحدتها بالمسار.");return;}PK={id,flip:new Set(),all:false};route("train");return;}
  if(!PK||PK==="list")return;const sy=window.scrollY;
  if(e.target.closest("[data-pkall]")){PK.all=!PK.all;PK.flip.clear();route("train");window.scrollTo(0,sy);return;}
  const f=e.target.closest("[data-pkflip]");if(f){const i=+f.dataset.pkflip,w=packWords(PK.id)[i];if(PK.flip.has(i))PK.flip.delete(i);else{PK.flip.add(i);}route("train");window.scrollTo(0,sy);if(w&&PK.flip.has(i))speakWord(w[0]);return;}
});
function speakWord(t){const b=document.createElement("button");b.setAttribute("data-say",t);b.hidden=true;document.body.appendChild(b);b.click();b.remove();}
let curView="home";
function route(v){if(v==="tracks")v="path";if(!V[v])v="home";curView=v;$("view").innerHTML=V[v]();document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-current",t.dataset.tab===v?"page":"false"));window.scrollTo(0,0);try{history.replaceState(null,"","#"+v);}catch(e){}}
document.addEventListener("click",e=>{
  if(e.target.closest(".lesson-close")){window.closeLesson();return;}
  if(e.target.closest("[data-logo]")){logoTaps++;clearTimeout(logoT);logoT=setTimeout(()=>logoTaps=0,1500);if(logoTaps>=5){logoTaps=0;showAdmin=true;route("me");}return;}
  const t=e.target.closest(".tab");if(t){confirmReset=false;route(t.dataset.tab);return;}
  const a=e.target.closest("[data-act]");
  if(a){const act=a.dataset.act;
    if(act==="lesson")openLesson(a.dataset.id);
    else if(act==="soon")toast("هاي الوحدة قيد التحضير، رح تنفتح قريبًا.");
    else if(act==="admin-on"){const v=(document.getElementById("admin-code")||{}).value||"";if(v.trim()==="jasher-admin"){P.admin=true;save();route("me");toast("تفعّل وضع المدير. كل الوحدات الجاهزة صارت مفتوحة.");}else toast("الرمز غلط. جرب كمان مرة.");}
    else if(act==="admin-off"){P.admin=false;save();route("me");toast("وقّفت وضع المدير.");}
    else if(act==="train")route("train");
    else if(act==="dmore"){dlimit+=60;route("dict");}
    else if(act==="placement")toast("اختبار تحديد المستوى قيد التحضير.");
    else if(act==="reset"){if(!confirmReset){confirmReset=true;route("me");}else{confirmReset=false;Object.assign(P,{xp:0,streak:0,last:null,today:{d:today(),xp:0},units:{},start:today(),saved:[]});save();L.reset();route("me");toast("انمسح تقدمك.");}}
    return;}
  const lv=e.target.closest("[data-lv]");if(lv){const n=+lv.dataset.lv;openLv=openLv===n?-1:n;route("path");return;}
  const un=e.target.closest("[data-unit]");if(un){const s=un.dataset.s;if(s==="current"||(s==="done"&&PLAYABLE[un.dataset.unit]))openLesson(un.dataset.unit);else if(s==="soon")toast("هاي الوحدة قيد التحضير، رح تنفتح قريبًا.");else toast("خلّص الوحدة اللي قبلها أول.");return;}
  const sv=e.target.closest("[data-save]");if(sv){const i=+sv.dataset.save;const k=P.saved.indexOf(i);if(k<0){P.saved.push(i);toast("انحفظت الكلمة بمراجعتك.");}else P.saved.splice(k,1);save();route("home");return;}
  const us=e.target.closest("[data-unsave]");if(us){const i=+us.dataset.unsave;P.saved=P.saved.filter(x=>x!==i);save();route("me");return;}
  const dl=e.target.closest("[data-dlv]");if(dl){dlv=dl.dataset.dlv;dlimit=60;route("dict");return;}
  const dop=e.target.closest("[data-dopen]");if(dop){dopen=dopen===dop.dataset.dopen?null:dop.dataset.dopen;const y=window.scrollY;route("dict");window.scrollTo(0,y);return;}
  const ds=e.target.closest("[data-dsave]");if(ds){const h=ds.dataset.dsave;if(!Array.isArray(P.myWords))P.myWords=[];const k=P.myWords.indexOf(h);if(k<0)P.myWords.push(h);else P.myWords.splice(k,1);save();const y=window.scrollY;route(curView);window.scrollTo(0,y);return;}
  const g=e.target.closest("[data-goal]");if(g){P.goal=+g.dataset.goal;save();route("me");}
});
let dT;document.addEventListener("input",e=>{if(e.target.id==="dq"){clearTimeout(dT);const v=e.target.value;dT=setTimeout(()=>{dq=v;dlimit=60;route("dict");const i=document.getElementById("dq");if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}},180);}});
const h=(location.hash||"").slice(1);
route(V[h]?h:"home");
})();
